향을 떠나다.","en":"To leave one's hometown.","src":"우리말샘"},{"ko":"내가 살던 고향.","en":"The hometown where I used to live.","src":"우리말샘"},{"ko":"고향을 그리워하다.","en":"To miss one's hometown.","src":"우리말샘"}],"explain_en":"Going from Seoul to the provinces is '내려가다' (go down), and going to Seoul is '올라가다' (go up). So at Seollal and Chuseok you often hear '고향에 내려가요' (I'm going down to my hometown)."},{"id":"n00451","kind":"word","ko":"밑","yo":"","en":"Bottom / Under","pos":"명사","usage":"","contract":"","examples":[{"id":"e00059","ko":"책상 밑에 가방이 있어요.","en":"There's a bag under the desk.","speech_level":"해요","cloze":"밑","extra_word":"책상 = desk","extra_grammar":""},{"id":"e00060","ko":"의자 밑에 뭐가 있어요?","en":"What's under the chair?","speech_level":"해요","cloze":"밑","extra_word":"의자 = chair","extra_grammar":""}],"pron":"믿","roman":"mit","explain":"'밑'은 '아래'와 비슷하지만, 가려진 바로 아래나 바닥 쪽을 말할 때 더 많이 써요. '사장님 밑에서 일해요'처럼 '누구 밑에서'는 그 사람 아래에서 일하거나 배운다는 뜻이에요.","video_url":"","video_title":"","phrases":[{"ko":"밑 빠진 독에 물 붓기","example":"그 가게에 돈을 더 넣는 건 밑 빠진 독에 물 붓기예요.","literal":"\"pouring water into a jar with no bottom\"","en_equiv":"close: pouring money down the drain","meaning_en":"Effort or money wasted with no result at all.","nuance_ko":"돈·노력이 헛될 때","source":"우리말샘"},{"ko":"밑도 끝도 없이","example":"친구가 밑도 끝도 없이 '미안해'라고 했어요.","literal":"\"with no bottom and no end\"","en_equiv":"out of the blue","meaning_en":"Suddenly, with no context or explanation.","nuance_ko":"갑자기 뜬금없이 말할 때","source":"우리말샘"},{"ko":"등잔 밑이 어둡다","example":"안경을 찾았는데 머리 위에 있었어요. 등잔 밑이 어둡네요.","literal":"\"it's dark under the oil lamp\"","en_equiv":"close: it was right under my nose","meaning_en":"What's closest to you is hardest to notice.","nuance_ko":"가까이 있는데 못 찾을 때","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"지붕 밑.","en":"Under the roof.","src":"우리말샘"},{"ko":"산 밑 마을.","en":"A village at the foot of the mountain.","src":"우리말샘"},{"ko":"잃어버렸던 책을 책상 밑에서 찾았다.","en":"I found the book I'd lost under the desk.","src":"우리말샘"}],"explain_en":"밑 is close to 아래, but it's used more for the spot right underneath something, often hidden, or the bottom of it. '누구 밑에서' (under someone) means working or learning under that person, e.g. 사장님 밑에서 일해요."},{"id":"n00461","kind":"word","ko":"커피","yo":"","en":"Coffee","pos":"명사","usage":"","contract":"","examples":[{"id":"e00237","ko":"커피가 너무 써요.","en":"The coffee is too bitter.","speech_level":"해요","cloze":"커피","extra_word":"쓰다 = to be bitter","extra_grammar":""},{"id":"e00238","ko":"저는 매일 커피를 마셔요.","en":"I drink coffee every day.","speech_level":"해요","cloze":"커피","extra_word":"매일 = every day","extra_grammar":""}],"pron":"커피","roman":"keopi","explain":"한국은 카페가 정말 많은 나라예요. 점심을 먹고 동료들과 카페에 가는 게 거의 하루 일과예요.","video_url":"","video_title":"","phrases":[{"ko":"커피 한잔해요","example":"시간 되면 커피 한잔해요.","literal":"\"let's do a cup of coffee\"","en_equiv":"Let's grab a coffee","meaning_en":"let's meet and talk; the coffee is the excuse","nuance_ko":"'이야기하자'는 뜻일 때 많아요","source":"common usage"},{"ko":"아아 (아이스 아메리카노)","example":"아아 한 잔 주세요.","literal":"\"ah-ah\" (iced Americano)","en_equiv":"close: iced Americano (slang)","meaning_en":"slang short form of 'iced Americano'","nuance_ko":"겨울에도 마셔요 (얼죽아)","source":"common usage"},{"ko":"믹스커피","example":"회사 탕비실에는 늘 믹스커피가 있어요.","literal":"\"mix coffee\"","en_equiv":"close: 3-in-1 instant coffee","meaning_en":"instant coffee stick with sugar and creamer","nuance_ko":"사무실, 어른들 커피","source":"common usage"}],"pron_source":"wiktionary","dict_examples":[{"ko":"진한 커피.","en":"Strong coffee.","src":"우리말샘"},{"ko":"커피를 타다.","en":"To make (instant) coffee.","src":"우리말샘"},{"ko":"커피를 한 잔 마시다.","en":"To drink a cup of coffee.","src":"우리말샘"}],"explain_en":"Korea has an amazing number of cafés. Going to a café with coworkers after lunch is almost part of the daily routine."},{"id":"n00470","kind":"word","ko":"케이크","yo":"","en":"Cake","pos":"명사","usage":"","contract":"","examples":[{"id":"e00241","ko":"오늘 제 생일이에요. 케이크 먹어요!","en":"It's my birthday today. Let's have cake!","speech_level":"해요","cloze":"케이크","extra_word":"생일 = birthday","extra_grammar":""},{"id":"e00242","ko":"저는 초콜릿 케이크를 좋아해요.","en":"I like chocolate cake.","speech_level":"해요","cloze":"케이크","extra_word":"초콜릿 = chocolate","extra_grammar":""}],"pron":"케이크","roman":"keikeu","explain":"","video_url":"","video_title":"","phrases":[],"pron_source":"wiktionary","dict_examples":[{"ko":"케이크를 자르다.","en":"","src":"우리말샘"},{"ko":"생일 축하 케이크.","en":"","src":"우리말샘"}],"explain_en":""},{"id":"n00481","kind":"word","ko":"물","yo":"","en":"Water","pos":"명사","usage":"","contract":"","examples":[{"id":"e00247","ko":"저는 물을 많이 마셔요.","en":"I drink a lot of water.","speech_level":"해요","cloze":"물","extra_word":"","extra_grammar":""},{"id":"e00248","ko":"물이 너무 차가워요.","en":"The water is too cold.","speech_level":"해요","cloze":"물","extra_word":"차갑다 = to be cold","extra_grammar":""}],"pron":"물","roman":"mul","explain":"한국 식당에서 물은 공짜예요. '물은 셀프'라고 쓰여 있으면 직접 가져다 마셔요.","video_url":"","video_title":"","phrases":[{"ko":"물 건너가다","example":"표가 다 팔렸어요. 여행은 물 건너갔어요.","literal":"\"it has crossed the water\"","en_equiv":"the ship has sailed","meaning_en":"it's too late; the chance is gone","nuance_ko":"포기할 때, 아쉬울 때","source":"우리말샘"},{"ko":"물 쓰듯 (하다)","example":"동생은 돈을 물 쓰듯 써요.","literal":"\"like using water\"","en_equiv":"to spend money like water","meaning_en":"to waste money carelessly","nuance_ko":"돈을 막 쓸 때","source":"우리말샘"},{"ko":"물로 보다","example":"저를 물로 봐요? 저도 다 알아요.","literal":"\"to see someone as water\"","en_equiv":"close: to take someone for a pushover","meaning_en":"to look down on someone as weak or easy","nuance_ko":"화났을 때 (보통 반말)","source":"우리말샘"}],"pron_source":"우리말샘","dict_examples":[{"ko":"물 한 모금.","en":"A sip of water.","src":"우리말샘"},{"ko":"물을 엎지르다.","en":"To spill water.","src":"우리말샘"},{"ko":"물이 꽁꽁 얼다.","en":"The water freezes solid.","src":"우리말샘"}],"explain_en":"Water is free at Korean restaurants. If you see a sign saying '물은 셀프' (water is self-service), go and get it yourself."},{"id":"n00487","kind":"word","ko":"주스","yo":"","en":"Juice","pos":"명사","usage":"","contract":"","examples":[{"id":"e00249","ko":"저는 사과 주스를 좋아해요.","en":"I like apple juice.","speech_level":"해요","cloze":"주스","extra_word":"사과 = apple","extra_grammar":""},{"id":"e00250","ko":"아침에 주스를 마셔요.","en":"I drink juice in the morning.","speech_level":"해요","cloze":"주스","extra_word":"아침 = morning","extra_grammar":""}],"pron":"주스","roman":"juseu","explain":"","video_url":"","video_title":"","phrases":[],"pron_source":"wiktionary","dict_examples":[{"ko":"주스를 한 잔 마시다.","en":"","src":"우리말샘"},{"ko":"그녀는 오렌지를 갈아서 주스를 직접 만들었다.","en":"","src":"우리말샘"}],"explain_en":""},{"id":"n00492","kind":"word","ko":"우유","yo":"","en":"Milk","pos":"명사","usage":"","contract":"","examples":[{"id":"e00251","ko":"커피에 우유를 넣어요.","en":"I put milk in my coffee.","speech_level":"해요","cloze":"우유","extra_word":"넣다 = to put in","extra_grammar":""},{"id":"e00252","ko":"우유가 냉장고에 있어요.","en":"The milk is in the fridge.","speech_level":"해요","cloze":"우유","extra_word":"냉장고 = fridge","extra_grammar":""}],"pron":"우유","roman":"uyu","explain":"","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","dict_examples":[{"ko":"우유 배달부.","en":"","src":"우리말샘"},{"ko":"우유 한 잔.","en":"","src":"우리말샘"},{"ko":"우유를 마시다.","en":"","src":"우리말샘"},{"ko":"그는 우유와 빵으로 아침 식사를 했다.","en":"","src":"우리말샘"}],"explain_en":""},{"id":"n00499","kind":"word","ko":"지갑","yo":"","en":"Wallet","pos":"명사","usage":"","contract":"","examples":[{"id":"e00061","ko":"지갑에 돈이 없어요.","en":"There's no money in my wallet.","speech_level":"해요","cloze":"지갑","extra_word":"돈 = money","extra_grammar":""},{"id":"e00062","ko":"지갑에 사진이 있어요.","en":"I keep a photo in my wallet.","speech_level":"해요","cloze":"지갑","extra_word":"사진 = photo","extra_grammar":""}],"pron":"지갑","roman":"jigap","explain":"요즘 한국에서는 현금을 거의 안 써서, 큰 지갑 대신 카드 몇 장만 넣는 '카드 지갑'이나 휴대폰 케이스를 많이 써요.","video_url":"","video_title":"","phrases":[{"ko":"지갑을 열다","example":"세일하면 사람들이 지갑을 열어요.","literal":"\"open the wallet\"","en_equiv":"close: loosen the purse strings","meaning_en":"To start spending money.","nuance_ko":"뉴스·광고에서 자주","source":"common usage"},{"ko":"지갑이 얇다","example":"월급날 전이라 지갑이 얇아요.","literal":"\"the wallet is thin\"","en_equiv":"close: be strapped for cash","meaning_en":"To have little money right now.","nuance_ko":"돈 없을 때 가볍게","source":"common usage"},{"ko":"지갑 사정","example":"요즘 지갑 사정이 안 좋아요.","literal":"\"the wallet's situation\"","en_equiv":"close: one's budget / finances","meaning_en":"How much money you have to spend.","nuance_ko":"돈 얘기를 부드럽게","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"동전 지갑.","en":"A coin purse.","src":"우리말샘"},{"ko":"나는 물건값을 치르기 위해 지갑에서 돈을 꺼냈다.","en":"I took money out of my wallet to pay for the item.","src":"우리말샘"},{"ko":"전철 안에서 지갑을 날치기당했다.","en":"My wallet was snatched on the subway.","src":"우리말샘"}],"explain_en":"Koreans hardly use cash these days, so instead of a big wallet many carry a slim 'card wallet' (카드 지갑) or keep a few cards in their phone case."},{"id":"n00502","kind":"word","ko":"사전","yo":"","en":"Dictionary","pos":"명사","usage":"","contract":"","examples":[{"id":"e00063","ko":"이 단어는 사전에 없어요.","en":"This word isn't in the dictionary.","speech_level":"해요","cloze":"사전","extra_word":"단어 = word","extra_grammar":""},{"id":"e00064","ko":"한국어 사전 있어요?","en":"Do you have a Korean dictionary?","speech_level":"해요","cloze":"사전","extra_word":"한국어 = Korean (language)","extra_grammar":""}],"pron":"사전","roman":"sajeon","explain":"","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","dict_examples":[{"ko":"영어 사전.","en":"","src":"우리말샘"},{"ko":"사전 두 권.","en":"","src":"우리말샘"},{"ko":"사전을 편찬하다.","en":"","src":"우리말샘"},{"ko":"학생들은 모르는 단어의 뜻을 사전에서 찾았다.","en":"","src":"우리말샘"}],"explain_en":""},{"id":"n00506","kind":"word","ko":"컵","yo":"","en":"Cup","pos":"명사","usage":"","contract":"","examples":[{"id":"e00065","ko":"컵에 물이 있어요.","en":"There's water in the cup.","speech_level":"해요","cloze":"컵","extra_word":"물 = water","extra_grammar":""},{"id":"e00066","ko":"회사에 제 컵이 있어요.","en":"I keep my own cup at the office.","speech_level":"해요","cloze":"컵","extra_word":"회사 = company","extra_grammar":""}],"pron":"컵","roman":"keop","explain":"","video_url":"","video_title":"","phrases":[],"pron_source":"wiktionary","dict_examples":[{"ko":"우유를 컵에 따라 마셨다.","en":"","src":"우리말샘"},{"ko":"그는 주전자의 물을 컵에 가득히 따랐다.","en":"","src":"우리말샘"},{"ko":"나는 빨간 체리만 남아 있는 내 컵을 들어 보였다.","en":"","src":"우리말샘"},{"ko":"직원은 씹던 밥을 꿀컥 삼키고 컵에 담긴 물을 한 모금 마신 다음 말을 이었다.","en":"","src":"우리말샘"}],"explain_en":""},{"id":"n00512","kind":"word","ko":"가방","yo":"","en":"Bag / Backpack","pos":"명사","usage":"","contract":"","examples":[{"id":"e00067","ko":"가방이 너무 무거워요.","en":"My bag is too heavy.","speech_level":"해요","cloze":"가방","extra_word":"무겁다 = to be heavy","extra_grammar":""},{"id":"e00068","ko":"제 가방이 없어요!","en":"My bag is gone!","speech_level":"해요","cloze":"가방","extra_word":"","extra_grammar":""}],"pron":"가방","roman":"gabang","explain":"가방은 등에 지면 '메다', 손에 들면 '들다'라고 해요. 그리고 한국 카페에서는 자리를 맡을 때 가방을 의자에 놓고 주문하러 가요.","video_url":"","video_title":"","phrases":[{"ko":"가방끈이 길다","example":"우리 형은 박사예요. 가방끈이 길어요.","literal":"\"the bag strap is long\"","en_equiv":"—","meaning_en":"Has studied for many years; highly educated.","nuance_ko":"학력 이야기할 때 농담처럼","source":"common usage"},{"ko":"가방끈이 짧다","example":"저는 가방끈이 짧지만 일은 잘해요.","literal":"\"the bag strap is short\"","en_equiv":"—","meaning_en":"Didn't study long; has little formal schooling.","nuance_ko":"자기를 낮출 때. 남에게는 실례","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"여행 가방.","en":"A suitcase.","src":"우리말샘"},{"ko":"서류 가방.","en":"A briefcase.","src":"우리말샘"},{"ko":"모자를 벗어 가방 속에 넣었다.","en":"I took off my hat and put it in my bag.","src":"우리말샘"}],"explain_en":"With bags, Koreans say '메다' when it's on your back or shoulder and '들다' when it's in your hand. And in Korean cafés, people save a seat by leaving their bag on the chair while they go order."},{"id":"n00514","kind":"word","ko":"카메라","yo":"","en":"Camera","pos":"명사","usage":"","contract":"","examples":[{"id":"e00069","ko":"휴대폰 카메라가 정말 좋아요.","en":"The phone camera is really good.","speech_level":"해요","cloze":"카메라","extra_word":"휴대폰 = mobile phone","extra_grammar":""},{"id":"e00070","ko":"이 카메라는 사진이 잘 나와요.","en":"This camera takes good pictures.","speech_level":"해요","cloze":"카메라","extra_word":"나오다 = to come out (사진이 잘 나와요 = photos come out well)","extra_grammar":""}],"pron":"카메라","roman":"kamera","explain":"","video_url":"","video_title":"","phrases":[],"pron_source":"wiktionary","dict_examples":[{"ko":"카메라로 사진을 찍다.","en":"","src":"우리말샘"},{"ko":"카메라의 셔터를 누르다.","en":"","src":"우리말샘"}],"explain_en":""},{"id":"n00516","kind":"word","ko":"것","yo":"","en":"Thing / Object","pos":"의존 명사","usage":"","contract":"이것은 → 이건, 이것이 → 이게, 이것을 → 이걸 (그것·저것도 같아요)","examples":[{"id":"e00071","ko":"이 우산은 제 것이에요.","en":"This umbrella is mine.","speech_level":"해요","cloze":"것","extra_word":"","extra_grammar":""},{"id":"e00072","ko":"이 책은 누구 것이에요?","en":"Whose book is this?","speech_level":"해요","cloze":"것","extra_word":"","extra_grammar":""}],"pron":"걷","roman":"geot","explain":"말할 때는 '것'보다 '거'를 훨씬 많이 써요. 그리고 '것이'는 '게', '것은'은 '건', '것을'은 '걸'로 줄여 말해요.","video_url":"","video_title":"","phrases":[{"ko":"거 봐요","example":"거 봐요, 제 말이 맞죠?","literal":"\"look at that thing\"","en_equiv":"See? I told you so.","meaning_en":"Said when you've been proved right.","nuance_ko":"내 말이 맞았을 때","source":"common usage"},{"ko":"별거 아니에요","example":"작은 선물이에요. 별거 아니에요.","literal":"\"it's not a special thing\"","en_equiv":"It's nothing. / It's no big deal.","meaning_en":"A modest reply when giving a gift or being thanked.","nuance_ko":"선물 줄 때, 겸손하게","source":"common usage"},{"ko":"-ㄴ 것 같아요","example":"이 옷, 좀 큰 것 같아요.","literal":"\"it seems like a thing that is big\"","en_equiv":"I think… / It seems…","meaning_en":"Softens an opinion; Koreans use it constantly.","nuance_ko":"말을 부드럽게 할 때","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"먹을 것.","en":"Something to eat.","src":"우리말샘"},{"ko":"마실 것.","en":"Something to drink.","src":"우리말샘"},{"ko":"낡은 것은 버려라.","en":"Throw away the old things.","src":"우리말샘"}],"explain_en":"In speech Koreans say '거' far more than '것'. They also shorten '것이' to '게', '것은' to '건', and '것을' to '걸'."},{"id":"n00526","kind":"word","ko":"안경","yo":"","en":"Glasses / Eyeglasses","pos":"명사","usage":"","contract":"","examples":[{"id":"e00073","ko":"저는 안경을 써요.","en":"I wear glasses.","speech_level":"해요","cloze":"안경","extra_word":"쓰다 = to wear (glasses, hat)","extra_grammar":""},{"id":"e00074","ko":"제 안경이 어디 있어요?","en":"Where are my glasses?","speech_level":"해요","cloze":"안경","extra_word":"","extra_grammar":""}],"pron":"안경","roman":"angyeong","explain":"한국에는 안경점이 정말 많아요. 시력 검사를 하고 새 안경을 받기까지 한 시간 안에 끝나는 곳이 많아서 외국인들이 많이 놀라요.","video_url":"","video_title":"","phrases":[{"ko":"색안경을 끼고 보다","example":"외국인이라고 색안경을 끼고 보면 안 돼요.","literal":"\"look wearing colored glasses\"","en_equiv":"close: to look through a biased lens","meaning_en":"To judge someone with prejudice.","nuance_ko":"편견을 비판할 때","source":"우리말샘"},{"ko":"제 눈에 안경","example":"남들은 별로래요. 그래도 제 눈에 안경이죠.","literal":"\"glasses for one's own eyes\"","en_equiv":"Beauty is in the eye of the beholder.","meaning_en":"If you love it, it looks perfect to you.","nuance_ko":"애인·물건 자랑할 때 농담으로","source":"우리말샘"},{"ko":"안경잡이","example":"어릴 때 제 별명이 안경잡이였어요.","literal":"\"glasses-wearer\"","en_equiv":"close: four-eyes","meaning_en":"A teasing nickname for someone who wears glasses.","nuance_ko":"놀리는 말. 어른에게는 X","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"안경을 끼다.","en":"To wear glasses.","src":"우리말샘"},{"ko":"안경을 벗다.","en":"To take off one's glasses.","src":"우리말샘"},{"ko":"그녀는 알이 없는 안경을 썼다.","en":"She wore glasses with no lenses.","src":"우리말샘"}],"explain_en":"Korea has optical shops everywhere. At many of them, the eye test and your new pair of glasses are done within an hour, which surprises a lot of foreigners."},{"id":"n00529","kind":"word","ko":"잔","yo":"","en":"Cup / Glass","pos":"의존 명사","usage":"","contract":"","examples":[{"id":"e00253","ko":"커피를 하루에 세 잔 마셔요.","en":"I drink three cups of coffee a day.","speech_level":"해요","cloze":"잔","extra_word":"하루 = a day","extra_grammar":""},{"id":"e00254","ko":"우리 맥주 한 잔 해요.","en":"Let's have a beer.","speech_level":"해요","cloze":"잔","extra_word":"맥주 = beer","extra_grammar":""}],"pron":"잔","roman":"jan","explain":"한국에서는 옆 사람 잔이 비면 채워 줘요. 윗사람에게 술을 따를 때와 받을 때는 두 손으로 해요.","video_url":"","video_title":"","phrases":[{"ko":"한잔하다","example":"오늘 일 끝나고 한잔해요?","literal":"\"to do one glass\"","en_equiv":"to grab a drink","meaning_en":"without saying what, it usually means alcohol","nuance_ko":"커피 아니면 보통 술","source":"common usage"},{"ko":"원샷","example":"자, 건배! 다 같이 원샷!","literal":"\"one shot\"","en_equiv":"close: bottoms up / down it","meaning_en":"drink the whole glass in one go","nuance_ko":"회식·술자리에서 (콩글리시)","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"우유 한 잔.","en":"A glass of milk.","src":"우리말샘"},{"ko":"커피 두 잔.","en":"Two cups of coffee.","src":"우리말샘"}],"explain_en":"In Korea, when the person next to you has an empty glass, you fill it for them. When pouring for or receiving a drink from someone older, use both hands."},{"id":"n00535","kind":"word","ko":"우산","yo":"","en":"Umbrella","pos":"명사","usage":"","contract":"","examples":[{"id":"e00075","ko":"비가 와요. 우산 있어요?","en":"It's raining. Do you have an umbrella?","speech_level":"해요","cloze":"우산","extra_word":"비 = rain","extra_grammar":""},{"id":"e00076","ko":"우산이 없어요. 어떻게 해요?","en":"I don't have an umbrella. What do I do?","speech_level":"해요","cloze":"우산","extra_word":"","extra_grammar":""}],"pron":"우산","roman":"usan","explain":"우산은 '들다'보다 '쓰다'라고 해요. 모자나 안경처럼요. 갑자기 비가 오면 많은 사람이 편의점에서 우산을 사서, 집에 '편의점 우산'이 쌓이기도 해요.","video_url":"","video_title":"","phrases":[{"ko":"우산을 같이 쓰다","example":"우산 같이 쓸래요?","literal":"\"wear an umbrella together\"","en_equiv":"to share an umbrella","meaning_en":"Walking together under one umbrella.","nuance_ko":"드라마 설레는 장면 단골","source":"common usage"},{"ko":"우산 장수 아들, 짚신 장수 아들","example":"우산 장수, 짚신 장수 아들 둔 엄마처럼 매일 걱정해요.","literal":"\"umbrella-seller son, straw-shoe-seller son\"","en_equiv":"—","meaning_en":"Always finding something to worry about, rain or shine.","nuance_ko":"걱정 많은 사람 이야기","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"우산을 펴다.","en":"To open an umbrella.","src":"우리말샘"},{"ko":"우산을 접다.","en":"To fold an umbrella.","src":"우리말샘"},{"ko":"우산을 받치다.","en":"To hold up an umbrella.","src":"우리말샘"}],"explain_en":"With umbrellas Koreans say '쓰다' (to wear), not '들다' (to hold) — just like hats and glasses. When it suddenly rains, many people buy one at a convenience store, so convenience-store umbrellas tend to pile up at home."},{"id":"n00556","kind":"word","ko":"얼굴","yo":"","en":"Face","pos":"명사","usage":"","contract":"","examples":[{"id":"e00127","ko":"아기 얼굴이 정말 작아요.","en":"The baby's face is so small.","speech_level":"해요","cloze":"얼굴","extra_word":"작다 = to be small","extra_grammar":""},{"id":"e00128","ko":"얼굴이 빨개요. 아파요?","en":"Your face is red. Are you sick?","speech_level":"해요","cloze":"얼굴","extra_word":"빨갛다 = to be red","extra_grammar":""}],"pron":"얼굴","roman":"eolgul","explain":"한국에서 '얼굴이 작아요'는 큰 칭찬이에요. 그리고 '얼굴 좋아 보여요'는 예쁘다는 말보다 건강해 보인다는 말이에요.","video_url":"","video_title":"","phrases":[{"ko":"얼굴 한번 봐요","example":"요즘 바빠요? 다음 주에 얼굴 한번 봐요.","literal":"\"let's see faces once\"","en_equiv":"Let's catch up sometime","meaning_en":"let's meet up; sometimes just a polite phrase","nuance_ko":"오랜만에 연락할 때","source":"common usage"},{"ko":"얼굴이 두껍다","example":"또 돈을 빌려 달래요? 얼굴도 두꺼워요.","literal":"\"the face is thick\"","en_equiv":"close: to have a lot of nerve","meaning_en":"shameless; not embarrassed when they should be","nuance_ko":"뻔뻔한 사람에게","source":"우리말샘"},{"ko":"얼굴에 씌어 있다","example":"피곤한 게 얼굴에 다 쓰여 있어요.","literal":"\"it is written on the face\"","en_equiv":"it's written all over your face","meaning_en":"your feelings show clearly on your face","nuance_ko":"기분이 다 보일 때","source":"우리말샘"}],"pron_source":"우리말샘","dict_examples":[{"ko":"얼굴을 씻다.","en":"To wash one's face.","src":"우리말샘"},{"ko":"그녀는 얼굴에 로션을 발랐다.","en":"She put lotion on her face.","src":"우리말샘"},{"ko":"햇빛에 눈이 부셔 얼굴을 찡그리다.","en":"To squint because the sunlight is too bright.","src":"우리말샘"}],"explain_en":"In Korea, 'you have a small face' is a big compliment. And 'your face looks good' means you look healthy and well, not that you look pretty."},{"id":"n00557","kind":"word","ko":"눈","yo":"","en":"Eye","pos":"명사","usage":"","contract":"","examples":[{"id":"e00129","ko":"아기는 눈이 정말 커요.","en":"The baby has really big eyes.","speech_level":"해요","cloze":"눈","extra_word":"","extra_grammar":""},{"id":"e00130","ko":"형은 눈이 나빠요.","en":"My older brother has bad eyesight.","speech_level":"해요","cloze":"눈","extra_word":"나쁘다 = to be bad","extra_grammar":""}],"pron":"눈","roman":"nun","explain":"눈은 eye도 되고 snow도 돼요: '눈이 와요'는 snow예요. 그리고 '눈치'는 말하지 않아도 분위기를 읽는 힘이에요. 한국 생활에서 아주 중요해요.","video_url":"","video_title":"","phrases":[{"ko":"눈이 높다","example":"제 친구는 눈이 너무 높아서 남자 친구가 없어요.","literal":"\"eyes are high\"","en_equiv":"to have high standards","meaning_en":"very picky, especially about dating partners","nuance_ko":"연애·쇼핑 이야기에서","source":"common usage"},{"ko":"눈 깜짝할 사이","example":"방학이 눈 깜짝할 사이에 끝났어요.","literal":"\"while an eye blinks\"","en_equiv":"in the blink of an eye","meaning_en":"very quickly","nuance_ko":"시간이 빨리 갈 때","source":"우리말샘"},{"ko":"눈에 넣어도 아프지 않다","example":"할머니는 손녀가 눈에 넣어도 아프지 않을 만큼 예쁘대요.","literal":"\"wouldn't hurt even if put in the eye\"","en_equiv":"close: the apple of one's eye","meaning_en":"loved dearly, usually a child or grandchild","nuance_ko":"부모·조부모가 아이를 두고","source":"우리말샘"}],"pron_source":"우리말샘","dict_examples":[{"ko":"눈을 뜨다.","en":"To open one's eyes.","src":"우리말샘"},{"ko":"눈을 감다.","en":"To close one's eyes.","src":"우리말샘"},{"ko":"눈이 맑다.","en":"To have clear eyes.","src":"우리말샘"}],"explain_en":"눈 means both 'eye' and 'snow': 눈이 와요 means it's snowing. Also, 눈치 is the skill of reading the room without being told — very important in Korean life."},{"id":"n00566","kind":"word","ko":"머리","yo":"","en":"Head / Hair","pos":"명사","usage":"","contract":"","examples":[{"id":"e00131","ko":"누나는 머리가 아주 길어요.","en":"My older sister's hair is very long.","speech_level":"해요","cloze":"머리","extra_word":"길다 = to be long","extra_grammar":""},{"id":"e00132","ko":"지금 머리를 감아요.","en":"I'm washing my hair now.","speech_level":"해요","cloze":"머리","extra_word":"감다 = to wash (hair)","extra_grammar":""}],"pron":"머리","roman":"meori","explain":"머리는 head도 되고 hair도 돼요. 미용실에서 자르거나 파마하는 걸 그냥 '머리(를) 하다'라고 해요. '머리가 좋다'는 smart라는 뜻이에요.","video_url":"","video_title":"","phrases":[{"ko":"머리(를) 맞대다","example":"우리 같이 머리를 맞대고 생각해 봐요.","literal":"\"to put heads against each other\"","en_equiv":"to put our heads together","meaning_en":"to think about a problem together","nuance_ko":"같이 방법을 찾을 때","source":"우리말샘"},{"ko":"머리(를) 식히다","example":"공부하다가 머리 좀 식히러 나왔어요.","literal":"\"to cool the head\"","en_equiv":"to clear your head","meaning_en":"to take a break and relax your mind","nuance_ko":"공부·일 사이에 쉴 때","source":"우리말샘"},{"ko":"머리에 피도 안 마르다","example":"머리에 피도 안 마른 애가 벌써 연애를 해요?","literal":"\"blood on the head isn't even dry yet\"","en_equiv":"wet behind the ears","meaning_en":"too young and inexperienced","nuance_ko":"어린 사람을 낮춰 볼 때","source":"우리말샘"}],"pron_source":"우리말샘","dict_examples":[{"ko":"머리가 아프다.","en":"To have a headache.","src":"우리말샘"},{"ko":"머리를 다치다.","en":"To hurt one's head.","src":"우리말샘"},{"ko":"머리에 모자를 쓰다.","en":"To put a hat on one's head.","src":"우리말샘"}],"explain_en":"머리 means both 'head' and 'hair'. Getting your hair cut or permed at the salon is simply 머리(를) 하다. 머리가 좋다 ('good head') means smart."},{"id":"n00604","kind":"word","ko":"책","yo":"","en":"Book","pos":"명사","usage":"","contract":"","examples":[{"id":"e00077","ko":"저는 책을 많이 읽어요.","en":"I read a lot of books.","speech_level":"해요","cloze":"책","extra_word":"읽다 = to read","extra_grammar":""},{"id":"e00078","ko":"집에 책이 정말 많아요.","en":"I have so many books at home.","speech_level":"해요","cloze":"책","extra_word":"많다 = to be many, a lot","extra_grammar":""}],"pron":"책","roman":"chaek","explain":"'책'은 다른 말과 잘 붙어요: 책상(desk), 책가방(school bag), 책방(bookstore). 그리고 한국 사람들은 '책을 읽다'만큼 '책을 보다'도 많이 써요.","video_url":"","video_title":"","phrases":[{"ko":"책벌레","example":"제 동생은 책벌레예요. 하루 종일 책만 봐요.","literal":"\"book bug\"","en_equiv":"bookworm","meaning_en":"Someone who loves reading.","nuance_ko":"칭찬, 가끔 놀리듯","source":"common usage"},{"ko":"책을 내다","example":"우리 선생님이 한국어 책을 냈어요.","literal":"\"put out a book\"","en_equiv":"to publish a book","meaning_en":"To write and publish a book.","nuance_ko":"'출판하다'보다 쉬운 말","source":"common usage"},{"ko":"책거리","example":"교재를 다 끝내서 반 친구들과 책거리를 했어요.","literal":"\"book(-finishing) treat\"","en_equiv":"—","meaning_en":"A small class party for finishing a textbook.","nuance_ko":"학교·학원에서 떡이나 과자로","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"책 한 권.","en":"One book.","src":"우리말샘"},{"ko":"책이 비싸다.","en":"Books are expensive.","src":"우리말샘"},{"ko":"책이 재미있다.","en":"The book is interesting.","src":"우리말샘"}],"explain_en":"'책' combines with lots of words: 책상 (desk, literally 'book table'), 책가방 (school bag), 책방 (bookstore). Koreans also say '책을 보다' (look at a book) about as often as '책을 읽다' (read a book)."},{"id":"n00663","kind":"word","ko":"키","yo":"","en":"Height (stature)","pos":"명사","usage":"","contract":"","examples":[{"id":"e00133","ko":"키가 몇 센티예요?","en":"How tall are you (in cm)?","speech_level":"해요","cloze":"키","extra_word":"센티 = centimeter","extra_grammar":""},{"id":"e00134","ko":"저는 키가 좀 작아요.","en":"I'm a bit short.","speech_level":"해요","cloze":"키","extra_word":"작다 = to be small, short","extra_grammar":""}],"pron":"키","roman":"ki","explain":"키는 '높다'가 아니라 '크다/작다'를 써요. 한국에서는 처음 만난 사람하고도 키 이야기를 편하게 하는 편이에요.","video_url":"","video_title":"","phrases":[{"ko":"키 많이 컸네!","example":"와, 민수야, 키 많이 컸네!","literal":"\"your height grew a lot\"","en_equiv":"Look how tall you've gotten!","meaning_en":"said to a child you haven't seen in a while","nuance_ko":"오랜만에 본 아이에게","source":"common usage"},{"ko":"키높이 깔창","example":"그 배우는 키높이 깔창을 신는대요.","literal":"\"height-raising insoles\"","en_equiv":"shoe lifts","meaning_en":"hidden insoles that make you look taller","nuance_ko":"키 이야기에서 농담으로","source":"common usage"},{"ko":"키 크고 싱겁지 않은 사람 없다","example":"형은 키도 크고 농담도 많아요. 키 크고 싱겁지 않은 사람 없다더니!","literal":"\"there's no tall person who isn't bland\"","en_equiv":"—","meaning_en":"playful saying: tall people tend to be goofy","nuance_ko":"키 큰 사람을 놀릴 때","source":"우리말샘"}],"pron_source":"우리말샘","dict_examples":[{"ko":"키가 크다.","en":"To be tall.","src":"우리말샘"},{"ko":"키를 재다.","en":"To measure someone's height.","src":"우리말샘"}],"explain_en":"For height, Koreans say 크다/작다 (big/small), never 높다 (high). In Korea people talk about height quite openly, even with someone they just met."},{"id":"n00666","kind":"word","ko":"몇","yo":"","en":"How many / Some","pos":"수사","usage":"","contract":"","examples":[{"id":"e00103","ko":"가족이 몇 명이에요?","en":"How many people are in your family?","speech_level":"해요","cloze":"몇","extra_word":"","extra_grammar":""},{"id":"e00104","ko":"지금 몇 시예요?","en":"What time is it now?","speech_level":"해요","cloze":"몇","extra_word":"","extra_grammar":""}],"pron":"멷","roman":"myeot","explain":"'몇'은 질문에만 쓰지 않아요. 끝을 내려서 '몇 명 왔어요.'라고 하면 '사람이 조금 왔어요'라는 뜻이에요. 어른에게 '몇 살이에요?'는 실례예요. '연세가 어떻게 되세요?'라고 물어요.","video_url":"","video_title":"","phrases":[{"ko":"몇 번을 말해야 돼?","example":"엄마가 '몇 번을 말해야 돼?' 하고 화냈어요.","literal":"\"how many times must I say it?\"","en_equiv":"How many times do I have to tell you?","meaning_en":"Frustrated scolding when someone keeps ignoring you.","nuance_ko":"잔소리할 때","source":"common usage"},{"ko":"몇 날 며칠","example":"그 문제로 몇 날 며칠을 고민했어요.","literal":"\"how many days, how many days\"","en_equiv":"for days on end","meaning_en":"For many days, longer than you'd expect.","nuance_ko":"오래 걸렸다고 강조","source":"common usage"},{"ko":"이게 몇 년 만이에요!","example":"와, 선배님! 이게 몇 년 만이에요!","literal":"\"after how many years is this!\"","en_equiv":"It's been ages!","meaning_en":"Greeting someone you haven't seen in years.","nuance_ko":"오랜만에 만났을 때","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"점수가 몇 대 몇이지?","en":"What's the score?","src":"우리말샘"},{"ko":"가족이 모두 몇이세요?","en":"How many are there in your family?","src":"우리말샘"},{"ko":"2에다 3을 더하면 몇이 됩니까?","en":"What do you get if you add 3 to 2?","src":"우리말샘"}],"explain_en":"몇 isn't only for questions: said with a falling tone, '몇 명 왔어요.' means 'a few people came.' Asking an older person '몇 살이에요?' is rude; ask '연세가 어떻게 되세요?' instead."},{"id":"n00795","kind":"word","ko":"있다","yo":"있어요","en":"to be (somewhere) / to have","pos":"동사","usage":"있다 = to be (there) / to have. Opposite: 없다.","contract":"","examples":[{"id":"e00109","ko":"저는 오빠가 있어요.","en":"I have an older brother.","speech_level":"해요","cloze":"있어요","extra_word":"오빠 = older brother (said by a woman)","extra_grammar":""},{"id":"e00110","ko":"우리 집에 개가 있어요.","en":"We have a dog at home.","speech_level":"해요","cloze":"있어요","extra_word":"개 = dog","extra_grammar":""}],"pron":"읻따","roman":"isseoyo","explain":"'있다'는 'to be somewhere'와 'to have' 두 뜻이에요. 어른이 어디에 있을 때는 '계세요'(아버지는 집에 계세요), 어른이 무엇을 가지고 있을 때는 '있으세요'(시간 있으세요?)라고 해요.","video_url":"","video_title":"","phrases":[{"ko":"있잖아요","example":"있잖아요, 저 사실 내일 이사 가요.","literal":"\"it's there, isn't it\"","en_equiv":"You know what…","meaning_en":"An opener to get attention before saying something.","nuance_ko":"말 꺼낼 때","source":"common usage"},{"ko":"있는 집","example":"그 친구는 있는 집 아이예요.","literal":"\"a house that has\"","en_equiv":"close: a well-off family","meaning_en":"A wealthy family.","nuance_ko":"돈 많은 집을 돌려 말할 때","source":"common usage"},{"ko":"있을 때 잘해","example":"있을 때 잘하세요. 나중에 후회해요.","literal":"\"do well while (they) are here\"","en_equiv":"close: you don't know what you've got till it's gone","meaning_en":"Treat people well while they're still with you.","nuance_ko":"연인·가족에게, 노래 제목","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"나에게 1000원이 있다.","en":"I have 1,000 won.","src":"우리말샘"},{"ko":"이 물건은 주인이 있다.","en":"This thing has an owner.","src":"우리말샘"},{"ko":"그는 실력이 있다.","en":"He is skilled.","src":"우리말샘"}],"explain_en":"있다 means both 'to be somewhere' and 'to have.' For an elder's location use 계세요 (아버지는 집에 계세요), but for what an elder has use 있으세요 (시간 있으세요?)."},{"id":"n00796","kind":"word","ko":"어머니","yo":"","en":"Mother","pos":"명사","usage":"어머니 = mother. 엄마 = mom (casual).","contract":"","examples":[{"id":"e00111","ko":"제 어머니는 한국 사람이에요.","en":"My mother is Korean.","speech_level":"해요","cloze":"어머니","extra_word":"","extra_grammar":""},{"id":"e00112","ko":"어머니 생일이 언제예요?","en":"When is your mother's birthday?","speech_level":"해요","cloze":"어머니","extra_word":"생일 = birthday","extra_grammar":""}],"pron":"어머니","roman":"eomeoni","explain":"한국 사람은 '내 엄마'보다 '우리 엄마'라고 많이 해요. 형제가 없어도 '우리'예요. 다른 사람의 어머니는 '어머님'이라고 높여요.","video_url":"","video_title":"","phrases":[{"ko":"이모, 여기 ~ 좀 주세요","example":"이모, 여기 김치 좀 더 주세요!","literal":"\"aunt (mom's sister), here…\"","en_equiv":"close: \"Excuse me, ma'am\" / \"Auntie\"","meaning_en":"A friendly way to call a server in a casual restaurant.","nuance_ko":"식당 아주머니를 부를 때","source":"common usage"},{"ko":"엄마 손은 약손","example":"배 아플 때 엄마가 '엄마 손은 약손' 하면서 만져 줬어요.","literal":"\"mom's hand is a medicine hand\"","en_equiv":"close: kiss it better","meaning_en":"A mother's touch heals; said rubbing a child's sore tummy.","nuance_ko":"아이 배 아플 때","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"우리 어머니께서 주무신다.","en":"My mother is sleeping.","src":"우리말샘"},{"ko":"며칠 뒤면 어머니의 회갑이다.","en":"In a few days it'll be my mother's 60th birthday.","src":"우리말샘"}],"explain_en":"Koreans say 우리 엄마 (our mom) rather than 내 엄마 (my mom), even i const ex=(n,k=0)=>n.examples.length?n.examples[k%n.examples.length]:null;
const hl=e=>{const i=e.ko.indexOf(e.cloze);return i<0?esc(e.ko):esc(e.ko.slice(0,i))+"<b>"+esc(e.cloze)+"</b>"+esc(e.ko.slice(i+e.cloze.length))};
const exBox=e=>e?`<div class="ex">${hl(e)}<div class="s muted">${esc(e.en)}</div></div>`:"";
const plusTag=()=>`<span class="plus">★ ${t(2,"플러스","Plus")}</span>`;

const isPlus=()=>S.plan!=="free";

const NEXT_BILL={month:["11월 16일","Nov 16"],year:["2027년 10월 16일","Oct 16, 2027"]};
/* savings lines for month/year members; one per Settings visit (teacher 2026-10-16) */
/* months → words people say ("1년 반 정도", "2년도 안 돼서"), not "19개월" (teacher 2026-10-16) */
function about(m){const h=Math.round(m/6)/2,y=Math.floor(h);return h<1?["반년 정도","about half a year"]:h===y?[`${y}년 정도`,`about ${y} year${y>1?"s":""}`]:[y?`${y}년 반 정도`:"반년 정도",`about ${h} years`]}
function before(m){const y=Math.ceil(m/12);return[`${y}년도 안 돼서`,`in under ${y} year${y>1?"s":""}`]}
function saveMsgs(){const P=PRICE,cur=S.plan==="year"?P.year/12:P.month,even=P.life/cur,a=about(even),b=before(even);
  return[[`평생 회원은 ${a[0]}면 본전이에요. 그다음부터는 계속 무료예요.`,`Lifetime pays for itself in ${a[1]}. After that it's free.`],
   [`${b[0]} 본전, 그 뒤로는 내는 돈이 없어요.`,`It pays for itself ${b[1]}, then you pay nothing more.`],

   [`3년 쓰면 $${Math.round(cur*36-P.life)}를 아껴요.`,`Save $${Math.round(cur*36-P.life)} over three years.`]]}

const FORTUNES=[["귀인을 만나는 날","귀인(貴人) = 나를 도와주는 사람","a day to meet someone who helps you"],["말 한마디로 천 냥 빚을 갚는 날","말 한마디에 천 냥 빚도 갚는다 (속담)","one kind word pays off a big debt"],["티끌 모아 태산","작은 것이 모여 큰 것이 돼요 (속담)","every little bit adds up"],["가는 말이 고와야 오는 말이 곱다","좋게 말하면 좋은 말이 돌아와요 (속담)","speak kindly and kindness returns"],["시작이 반이에요","시작하면 반은 한 거예요 (속담)","starting is half the work"],["웃으면 복이 와요","웃는 사람에게 좋은 일이 와요","smile and luck comes"],["금강산도 식후경","배부터 채우고 공부해요 (속담)","eat first, then sightseeing"]];
function fortune(){const f=FORTUNES[new Date().getDate()%FORTUNES.length];return`<div class="card s" data-fortune><b>🍀 ${t(2,"오늘의 운세","Today's fortune")}</b><span style="font-size:var(--fs-l)">${esc(f[0])}</span><span class="xs muted">${esc(f[1])} · ${esc(f[2])}</span></div>`}
function log(x){S.log.push(x)}
function toast(x,ms=1600){const el=$("#toast");el.textContent=x;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,ms)}
function hideToast(){clearTimeout(toast.t);$("#toast").hidden=true}
function go(screen,params={},push=true){hideToast();if(screen==="plus")S.plusVisits=(S.plusVisits||0)+1;if(push)S.history.push({screen:S.screen,params:S.params});S.screen=screen;S.params=params;S.sheet=null;render();$("#screen").scrollTop=0}
function back(){hideToast();const h=S.history.pop();if(h){S.screen=h.screen;S.params=h.params;S.sheet=null;render()}else home()}
function home(){S.history=[];go("home",{},false)}
const allWords=()=>[...SETS.flatMap(s=>s.word_ids),...LESSONS.flatMap(l=>l.word_ids).filter(id=>!SETS.some(s=>s.word_ids.includes(id))),...S.mine];
const learnedIds=()=>allWords().filter(id=>S.stage[id]>0);
const curSet=()=>SETS.find(s=>s.word_ids.some(id=>S.stage[id]===0))||SETS[SETS.length-1];
const setPct=s=>Math.round(100*s.word_ids.filter(id=>S.stage[id]>=2).length/s.word_ids.length);
const anySet=id=>SETS.find(x=>x.id===id)||LESSONS.find(x=>x.id===id)||(id==="MINE"?mineSet():null);
const mineSet=()=>({id:"MINE",kind:"mine",name_ko:"내가 넣은 단어",word_ids:S.mine,pattern_ids:[]});
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
/* what today's study holds: reviews = words whose memory schedule says "today"; new = daily setting, in order from the current set */
function dueIds(){return learnedIds().filter(id=>!S.paused[id]&&!S.assumed[id]&&(S.stage[id]===1||S.stage[id]===2)).slice(0,9)}
function newIds(){const s=curSet();return s.word_ids.filter(id=>S.stage[id]===0&&!S.paused[id]).slice(0,S.settings.newPerDay)}
function plan(){const w=S.widgetToday;const due=dueIds().filter(id=>w[id]!=="ok");
  Object.keys(w).forEach(id=>{if(w[id]==="bad"&&!due.includes(id))due.push(id)});return{due,fresh:newIds()}}
const planTotal=()=>{const p=plan();return p.due.length+p.fresh.length};
const minutes=(d,n)=>Math.max(1,Math.round((d*15+n*35)/60)); // ~15 s per review word, ~35 s per new word (meet + check)
const forgetIds=()=>learnedIds().filter(id=>S.stage[id]===1&&!S.paused[id]);
const isLesson=id=>LESSONS.some(l=>l.word_ids.includes(id));
const STAGE_EN=["New","Not sure yet","Learned","Learned","Can use"];
const stageName=i=>t(2,STAGES[i],STAGE_EN[i]);

/* jamo-level grading (stand-in; the real grader is built and tested in Stage 2) */
const JUNG=21,JONG=28;
function jamo(str){const o=[];for(const ch of str){const c=ch.charCodeAt(0)-0xAC00;if(c>=0&&c<11172)o.push(["c",Math.floor(c/(JUNG*JONG))],["j",Math.floor(c%(JUNG*JONG)/JONG)],["t",c%JONG]);else o.push(["x",ch])}return o}
const norm=s=>s.replace(/[\s.,!?~…'"·]/g,"");
function grade(input,answer){const a=norm(input),b=norm(answer);if(!a)return{r:"bad"};if(a===b)return{r:"ok"};
  const A=jamo(a),B=jamo(b);if(A.length!==B.length)return{r:"bad"};
  const d=A.map((x,i)=>x[0]!==B[i][0]||x[1]!==B[i][1]?B[i][0]:null).filter(Boolean);
  if(d.length===1&&d[0]!=="t")return{r:"almost"};return{r:"bad",batchim:d.length===1}}

/* ---------- session ---------- */
const card=(id,dir)=>({id,dir,key:id+":"+dir});
/* card type follows how well the word is known: new → 뜻 떠올리기 only; after 2 passes → 한국어로 쓰기 / 빈칸 too.
   A word missed on the widget today comes back as a different type. */
function dirFor(id){
  if(S.widgetToday[id]==="bad"&&NOTES[id].examples.length)return"cloze";
  if((S.pass[id]||0)<2||!NOTES[id].examples.length)return"rec";
  return shuffle(["rec","prod","cloze"])[0];
}
function interleave(reviews,fresh){ // new words spread through the session; each is asked again ~3 cards later
  const q=reviews.map(id=>card(id,dirFor(id)));
  fresh.forEach((id,k)=>{const p=Math.min(q.length,1+k*4);q.splice(p,0,card(id,"meet"));q.splice(Math.min(q.length,p+3),0,card(id,"rec"))});
  return q;
}
function startSession(kind,opts={}){
  let cards=[];
  if(kind==="today"){const p=plan();cards=interleave(shuffle(p.due),p.fresh)}
  if(kind==="note")cards=[card(opts.id,S.stage[opts.id]?dirFor(opts.id):"meet")].concat(S.stage[opts.id]?[]:[card(opts.id,"rec")]);
  if(kind==="list")cards=shuffle(opts.ids).map(id=>card(id,dirFor(id)));
  if(kind==="set"){const s=anySet(opts.set);
    cards=interleave(shuffle(s.word_ids.filter(id=>S.stage[id]>0&&!S.paused[id]).slice(0,6)),s.word_ids.filter(id=>!S.stage[id]).slice(0,S.settings.newPerDay))}
  S.cheered=false;
  S.session={kind,queue:cards,i:0,results:[],undo:null,input:"",hint:false,graded:null,ret:{screen:S.screen,params:S.params,history:[...S.history]}};
  log("session:"+kind+":"+cards.length);go("q",{},false);
}
const cur=()=>S.session&&S.session.queue[S.session.i];
function submit(result){const s=S.session,c=cur();
  s.undo={i:s.i,len:s.queue.length,stage:S.stage[c.id],pass:S.pass[c.id],res:s.results.length,ww:S.weekWords.length,queue:[...s.queue],assumed:S.assumed[c.id]};
  s.results.push({key:c.key,id:c.id,dir:c.dir,result});log(`result:${c.id}:${c.dir}:${result}`);S.studiedToday=true;
  if(result==="bad"){s.queue.push({...c,retry:true});S.pass[c.id]=0}
  else if(result==="known"){S.assumed[c.id]=true;S.stage[c.id]=2;S.pass[c.id]=2;s.queue=s.queue.filter((x,i)=>i<=s.i||x.id!==c.id)}
  else if(c.dir==="meet")S.stage[c.id]=Math.max(1,S.stage[c.id]||0);
  else{const before=S.stage[c.id];S.pass[c.id]=(S.pass[c.id]||0)+1;if(result!=="hard")S.stage[c.id]=Math.min(3,Math.max(1,before+1));
    if(before<2&&S.stage[c.id]>=2&&!S.weekWords.includes(c.id))S.weekWords.push(c.id)}
}
function nextCard(){const s=S.session;s.i++;s.input="";s.hint=false;s.graded=null;
  if(s.i>=s.queue.length){S.lastSession=s;S.session=null;log("done");finish(s);return}
  go("q",{},false);
  if(!S.cheered&&doneCount(s)===5&&s.queue.length-s.i>1){S.cheered=true;toast(t(3,"5개 했어요! 오늘 출석 ✓ · 언제 그만둬도 괜찮아요","5 done! Today counts ✓ · Stop any time"),2600)}}
const doneCount=s=>new Set(s.results.map(r=>r.id)).size;
function finish(s){ // today's study → home "오늘은 끝!"; a word / set / list → back where it started
  if(s.kind==="today"){S.todayDone=true;S.lastCount=doneCount(s);S.widgetToday={};home()}
  else{S.history=s.ret.history;go(s.ret.screen,s.ret.params,false);toast(t(2,`끝! ${doneCount(s)}개 했어요`,`Done! ${doneCount(s)} words`))}}

const backBtn=`<button class="icon" data-a="back" aria-label="뒤로">←</button>`;

function pronLine(n){const st=S.settings,base=ans(n),pr=n.dict_pron||n.pron;const bits=[];
  if(st.showPron&&pr&&pr!==base)bits.push(`[${esc(pr)}]`);if(st.showRoman&&n.roman)bits.push(esc(n.roman));
  return bits.length?`<p class="center s muted" style="margin:-6px 0 0" data-pron>${bits.join(" · ")}</p>`:""}

  if(c.dir==="meet")return{top:sessionTop(),
    html:`<p class="center xs muted" style="margin:8px 0 0">${t(1,"새 단어","New word")}</p><div class="fill"></div>${wordHead(n)}${exBox(ex(n))}<p class="center xs muted" style="margin:0">${t(3,"소리 내어 한 번 따라 해 보세요","Say it out loud once")}</p><div class="fill"></div>`,

  if(c.dir==="rec")return{top:sessionTop(),html:`<p class="center xs muted" style="margin:8px 0 0">${t(2,"뜻이 뭐예요?","What does it mean?")}</p><div class="fill"></div><div class="word">${esc(n.ko)}</div>${sound}<div class="fill"></div>`,

  const q=isCloze?(()=>{const p=e.ko.split(e.cloze);return`<p class="center xs muted" style="margin:0">${t(2,"빈칸에 들어갈 말은?","Fill in the blank")}</p><div style="font-size:var(--fs-l);text-align:center">${esc(p[0])}<span class="blank"></span>${esc(p[1]||"")}</div><p class="center s muted" style="margin:0">${esc(n.en)}</p>`})()
    :`<p class="center xs muted" style="margin:0">${t(2,"한국어로 뭐예요?","Say it in Korean")}</p><div class="mean" style="font-size:var(--fs-xl);font-weight:700">${esc(n.en)}</div>`;
  return{top:sessionTop(),
   html:`<div class="fill"></div>${q}${lv&&lv!=="중립"?`<div class="center"><span class="tag">${t(1,"말투","Style")}: ${esc(lv)}</span></div>`:""}
    <input type="text" id="inp" autocomplete="off" lang="ko" aria-label="한국어로 쓰기" placeholder="${t(2,"한국어로 쓰기","Type in Korean")}" value="${esc(s.input)}">

/* 5 정답 */
V.a=()=>{const s=S.session,c=cur(),n=NOTES[c.id],g=s.graded;const e=ex(n,c.dir==="cloze"?1:0);
  const res=c.dir==="rec"?"":g.r==="ok"?`<div class="res ok">${t(1,"맞았어요","Correct")}</div>`:g.r==="almost"?`<div class="res warn">${t(2,"거의 맞았어요","Almost right")}</div>`:g.dunno?`<div class="res warn">${t(2,"괜찮아요 · 조금 뒤에 다시 나와요","That's OK · it comes back soon")}</div>`:`<div class="res bad">${t(2,"아쉬워요 · 조금 뒤에 다시 나와요","Not quite · it comes back soon")}</div>`;
  const mine=c.dir!=="rec"&&g.r!=="ok"&&!g.dunno?`<p class="center s muted" style="margin:0">${t(2,"내 답","You wrote")}: ${esc(s.input)}${g.batchim?t(2," (받침)"," (final consonant)"):""}</p>`:"";
  const more=hasExplain(n)?`🎬 ${t(2,"선생님 설명 · 예문 더 보기","Teacher's note · more examples")}`:t(2,"예문 더 보기","More examples");
  return{top:sessionTop()+starBtn(c.id),
   html:`${res}<div class="fill"></div>${wordHead(n)}${mine}${exBox(e)}<button class="link" data-a="detail" data-id="${n.id}" style="align-self:center">${more}</button><div class="fill"></div>`,
   foot:c.dir==="rec"?`<div class="pair"><button class="btn bad" data-a="self" data-v="bad">${t(1,"몰랐어요","Didn't know")}</button><button class="btn ok" data-a="self" data-v="ok">${t(1,"알았어요","Knew it")}</button></div>`
     :`<button class="btn pri" data-a="next">${t(1,"다음","Next")}</button>`,
   after:()=>{if(c.dir!=="rec"){const f=ev=>{if(ev.key==="Enter"){document.removeEventListener("keydown",f);if(S.screen==="a")act("next")}};setTimeout(()=>document.addEventListener("keydown",f),50)}}}};

/* 6 단어: everything about the word, no extra taps */
function videoBlock(n){
  if(!n.video_url)return`<p class="xs muted" style="margin:0">🎬 ${t(2,"선생님 영상 · 곧 나와요","Teacher's video · coming soon")}</p>`;
  if(isPlus())return`<div class="video" role="img" aria-label="광고 없는 앱 전용 영상 자리"><span>▶</span><span class="xs">${esc(n.video_title||"")}</span><span class="xs muted">${t(2,"광고 없이 앱에서 재생","Ad-free, plays in the app")}</span></div>`;
  return`<a class="btn" href="${esc(n.video_url)}" target="_blank" rel="noopener" data-a="video" style="display:flex;align-items:center;justify-content:center;text-decoration:none">▶ ${t(2,"유튜브에서 보기","Watch on YouTube")}</a>
   <button class="link xs" data-a="plus" style="align-self:flex-start;min-height:32px">${plusTag()} ${t(2,"광고 없이 앱에서 보기","watch ad-free in the app")}</button>`}
function teacherCard(n){return`<div class="card s"><b>${t(2,"선생님 설명","Teacher's note")}</b>${n.explain?`<span>${esc(t(3,n.explain,n.explain_en||n.explain))}</span>`:""}${videoBlock(n)}</div>`}
/* phrase = "표현 (meaning) :: 예문 :: 느낌" — example and nuance are optional */
const phrase=x=>{if(typeof x==="object"){const eq=x.en_equiv&&x.en_equiv!=="—"?x.en_equiv:"";
    return`<div class="ph"><b>${esc(x.ko)}</b>${x.example?`<span class="s">“${esc(x.example)}”</span>`:""}
      <span class="xs muted">${t(2,"직역","Literally")} ${esc(x.literal||"")}${eq?` · ${t(2,"영어로는","In English")} <i>${esc(eq)}</i>`:` · ${esc(x.meaning_en||"")}`}</span>
      ${x.nuance_ko?`<span class="xs muted">→ ${esc(t(3,x.nuance_ko,x.meaning_en||x.nuance_ko))}</span>`:""}</div>`}
  const [head,exs,nu]=x.split(" :: ");const m=head.match(/^(.*?) \((.*)\)$/);
  return`<div class="ph"><b>${esc(m?m[1]:head)}</b>${m?`<span class="xs muted">${esc(m[2])}</span>`:""}${exs?`<span class="s">“${esc(exs)}”</span>`:""}${nu?`<span class="xs muted">→ ${esc(nu)}</span>`:""}</div>`};
function phrasesCard(n){return(n.phrases||[]).length?`<div class="card s"><b>${t(2,"이렇게도 써요","Surprising uses")}</b>${n.phrases.map(phrase).join("")}</div>`:""}
/* examples: one card at a time with the next one peeking (NN/g: a cut-off card is the strongest "there's more" cue),
   dots + "2 / 3" + ‹ › under it (thumb zone), swipe or tap arrows, no autoplay; max 5 cards, then "예문 더 보기 (N)" */
function exCarousel(n){const ours=n.examples.map(e=>({html:hl(e),en:e.en,src:""})),dict=(n.dict_examples||[]).map(x=>({html:esc(x.ko),en:x.en||"",src:x.src||t(2,"사전","dictionary")}));
  const all=[...ours,...dict];if(!all.length)return"";
  const card=(x,k)=>`<div class="slide" role="group" data-k="${k}" aria-label="예문 ${k+1}/${all.length}">${(S.exVariant===3||S.exVariant===4)&&all.length>1?`<span class="xs muted pg">${k+1}/${Math.min(all.length,5)+(all.length>5?1:0)}</span>`:""}<div class="ko">${x.html}</div>${x.en?`<div class="s muted">${esc(x.en)}</div>`:""}${x.src?`<div class="xs muted">${t(2,"출처","Source")}: ${esc(x.src)}</div>`:""}<button class="icon sm play" data-a="sound" aria-label="예문 듣기">🔈</button></div>`;
  if(all.length===1)return`<div class="exc">${card(all[0],0).replace('class="slide"','class="slide" style="flex:none"')}</div>`;
  const shown=all.slice(0,5),rest=all.length-shown.length,pages=shown.length+(rest?1:0);
  const v=S.exVariant||2;
  return`<div class="exc v${v}" data-exs role="region" aria-roledescription="carousel" aria-label="예문">${v===4?`<button class="edge l" data-a="exPrev" aria-label="이전 예문">‹</button><button class="edge r" data-a="exNext" aria-label="다음 예문">›</button>`:""}
   <div class="track">${shown.map(card).join("")}${rest?`<button class="slide more" data-a="exAll">${t(2,`예문 더 보기 (${all.length})`,`All examples (${all.length})`)}</button>`:""}</div>
   ${exNav(pages)}</div>`}
/* four layouts for the controls under the example cards (compared in prototype/compare-examples.js) */
function exNav(pages){const v=S.exVariant||2;
  const dots=`<span class="dots" aria-hidden="true">${Array.from({length:pages},(_,k)=>`<i class="${k?"":"on"}"></i>`).join("")}</span>`;
  const cnt=`<span class="xs muted" data-count>1 / ${pages}</span>`,prev=`<button class="icon sm" data-a="exPrev" aria-label="이전 예문">‹</button>`,next=`<button class="icon sm" data-a="exNext" aria-label="다음 예문">›</button>`;
  if(v===1)return`<div class="nav">${dots}<span class="arrows">${cnt}${prev}${next}</span></div>`;      /* dots left, count + arrows right */
  if(v===2)return`<div class="nav center"><span class="cnt-r">${cnt}</span>${prev}${dots}${next}</div>`;   /* chosen: "1 / 6   ‹ • ━ • ›" — ‹ dots › centered, count at the left edge */
  if(v===3)return`<div class="nav center">${dots}</div>`;                                                  /* dots only; swipe or tap the next card */
  return`<div class="nav center">${dots}</div>`}                                                          /* 4: arrows sit on the card edges (see CSS) */
function initCarousels(){document.querySelectorAll("[data-exs]").forEach(box=>{const tr=box.querySelector(".track");
  const h=Math.max(...[...tr.children].map(c=>c.offsetHeight));[...tr.children].forEach(c=>c.style.minHeight=h+"px"); /* page doesn't jump */
  const w=()=>tr.children[0].offsetWidth+8;
  const upd=()=>{const k=Math.min(tr.children.length-1,Math.round(tr.scrollLeft/w()));const c=box.querySelector("[data-count]");if(c)c.textContent=`${k+1} / ${tr.children.length}`;
    box.querySelectorAll(".dots i").forEach((d,j)=>d.classList.toggle("on",j===k));[...tr.children].forEach((c2,j)=>c2.classList.toggle("cur",j===k))};
  tr.addEventListener("scroll",upd,{passive:true});
  /* tapping the card that peeks in from the side goes to it (as people expect from a half-visible card) */
  tr.addEventListener("click",e=>{const sl=e.target.closest(".slide");if(!sl||sl.classList.contains("cur")||e.target.closest("button"))return;tr.scrollTo({left:[...tr.children].indexOf(sl)*w(),behavior:"smooth"})});
  upd()})}
function dictCard(n){const d=n.dict_examples||[];return d.length?`${d.map(x=>`<div class="ex">${esc(x.ko)}${x.en?`<div class="s muted">${esc(x.en)}</div>`:""}</div>`).join("")}<p class="xs muted" style="margin:0">${t(2,"사전 예문 출처","Dictionary examples from")}: Wiktionary (CC BY-SA)</p>`:""}
function wordAll(n){const st=S.stage[n.id]??0;const src=isLesson(n.id)?`<span class="tag">${t(2,"수업에서","From class")} · ${esc(LESSONS.find(l=>l.word_ids.includes(n.id)).date)}</span>`:S.mine.includes(n.id)?`<span class="tag">${t(2,"내가 넣은 단어","Added by me")}</span>`:"";
  return`${src?`<div class="center">${src}</div>`:""}
   ${exCarousel(n)}
   ${teacherCard(n)}${phrasesCard(n)}
   ${n.usage?`<div class="card s"><b>${t(2,"헷갈리는 말","Don't mix up")}</b>${esc(n.usage)}</div>`:""}
   ${n.contract?`<div class="card s"><b>${t(2,"줄여서 말하면","Short forms")}</b>${esc(n.contract)}</div>`:""}
   ${S.memo[n.id]?`<div class="card s"><b>${t(2,"내 메모","My note")}</b>${esc(S.memo[n.id])}</div>`:""}
   <p class="center xs muted" style="margin:0">${S.starred[n.id]?"⭐ · ":""}${S.paused[n.id]?t(2,"복습에서 뺀 단어 · ⋯에서 되돌려요","Removed from reviews · undo in ⋯"):S.assumed[n.id]?t(2,"아는 단어 · 몇 주 뒤에 한 번 확인해요","Known · checked once in a few weeks"):st?`${stageName(st)} · ${t(2,"다음 복습","next review")} ${st>=2?t(2,"10월 23일","Oct 23"):t(2,"내일","tomorrow")}`:t(2,"아직 안 배운 단어","Not studied yet")}</p>`}
V.note=(p)=>{const n=NOTES[p.id];
  if(p.hide){ // opened from the widget
    const top=`<span style="flex:1"></span><button class="icon" data-a="widgetClose" aria-label="닫기">✕</button>`;
    if(!p.shown)return{top,html:`<p class="center muted" style="margin:24px 0 0">${t(2,"뜻이 기억나요?","Remember the meaning?")}</p><div class="fill"></div><div class="word">${esc(n.ko)}</div>${pronLine(n)}${sound}<div class="fill"></div>`,
      foot:`<button class="btn pri" data-a="showMeaning">${t(1,"뜻 보기","Show meaning")}</button>`};
    if(!p.graded)return{top,html:`<div class="fill"></div>${wordHead(n)}${exBox(ex(n))}<div class="fill"></div>`,
      foot:`<div class="pair"><button class="btn bad" data-a="noteSelf" data-v="bad">${t(1,"몰랐어요","Didn't know")}</button><button class="btn ok" data-a="noteSelf" data-v="ok">${t(1,"알았어요","Knew it")}</button></div>`};
    const tot=planTotal();
    const next=tot&&!S.todayDone?`<button class="btn pri" data-a="widgetStart">${t(1,"오늘 공부 이어서 하기",`Continue today's study`)} (${tot})</button><button class="link" data-a="widgetClose">${t(1,"닫기","Close")}</button>`:`<button class="btn pri" data-a="widgetClose">${t(1,"닫기","Close")}</button>`;
    if(p.graded==="ok"){ // knew it: praise, plus a small door to the story behind the word
      const door=hasExplain(n)?t(2,`'${n.ko}' 이야기도 알고 있어요?`,`Know the story behind '${n.ko}'?`):t(2,"예문 더 보기","More examples");
      return{top,html:`<div class="res ok">${t(2,"좋아요! 오늘 공부한 걸로 기록했어요","Nice! Counted for today")}</div>${p.more?"":`<div class="fill"></div>`}${wordHead(n)}
        ${p.more?exCarousel(n)+(hasExplain(n)?teacherCard(n)+phrasesCard(n):""):`<button class="link" data-a="widgetMore" style="align-self:center">${door} →</button><div class="fill"></div>`}`,foot:next}}
    return{top,html:`<div class="res warn">${t(2,"괜찮아요. 오늘 공부할 때 다른 문제로 한 번 더 나와요","That's OK. It comes back today as a different question")}</div>${wordHead(n)}${wordAll(n)}`,foot:next};
  }
  return{top:`${backBtn}<span style="flex:1"></span>${starBtn(n.id)}<button class="icon" data-a="noteMenu" aria-label="복습에서 빼기·메모·문장 써보기">⋯</button>`,
   html:`${wordHead(n)}${wordAll(n)}`,
   foot:p.fromSession?`<button class="btn pri" data-a="back">${t(1,"계속하기","Continue")}</button>`:`<button class="btn pri" data-a="noteReview" data-id="${n.id}">${S.stage[n.id]?t(2,"이 단어 복습하기","Review this word"):t(2,"이 단어 배우기","Learn this word")}</button>`}};

const wordRow=id=>`<button data-a="detail" data-id="${id}"><span class="grow"><b>${esc(NOTES[id].ko)}</b>${S.starred[id]?" ⭐":""} <span class="s muted">${S.stage[id]||S.mine.includes(id)?esc(NOTES[id].en):""}</span></span><span class="xs muted">${S.paused[id]?t(2,"뺀 단어","Removed"):S.assumed[id]?t(2,"아는 단어","Known"):S.stage[id]?stageName(S.stage[id]):""}</span></button>`;

/* 9 단어장: 세트별 또는 모든 단어. Filters live in one sheet (grouped), active ones show as removable pills. */
/* 9 단어장 '모든 단어' — one chip row, Spotify Library style (docs/research/ui-references.md A)
   nothing picked = all words. Pick one chip → row becomes [✕][picked ✓] + chips of the other kind (optional 2nd pick).
   Count and sort live in one small line above the list; sort opens a sheet. */
const KNOW=[["weak","잘 몰라요","Not sure",id=>S.stage[id]===1,"두 번 연속 맞히기 전이거나 최근에 틀린 단어예요.","Not yet right twice in a row, or missed recently."],
  ["known","외웠어요","Learned",id=>S.stage[id]===2||S.stage[id]===3,"여러 번 맞혀서 복습 간격이 길어진 단어예요.","Right several times; reviews are spaced out now."],
  ["use","쓸 수 있어요","Can use",id=>S.stage[id]===4,"선생님이 확인한 내 문장에 쓴 단어예요.","Used in a sentence your teacher checked."]];
const COLS=[["star","⭐ 별표","⭐ Starred",id=>S.starred[id],"단어 화면이나 정답 화면 오른쪽 위 ☆로 모은 단어예요.","Collected with ☆ at the top right of a word or answer."],
  ["lesson","수업에서","From class",isLesson,"선생님이 수업 뒤에 넣어 준 단어예요.","Added by your teacher after class."],
  ["mine","내가 넣은","Added by me",id=>S.mine.includes(id),"＋로 직접 넣은 단어예요.","Words you added with ＋."],
  ["paused","뺀 단어","Removed",id=>S.paused[id],"복습에서 뺀 단어예요. ⋯ → 다시 복습하기로 되돌려요.","Removed from reviews. ⋯ → Review again to bring back."]];
const SORTS=[["recent","최근 배운 순","Recent"],["weak","잘 모르는 순","Weakest first"],["abc","가나다순","A–Z (가나다)"]];
const CHIP=Object.fromEntries([...KNOW.map(x=>[x[0],{...x,kind:"know"}]),...COLS.map(x=>[x[0],{...x,kind:"col"}])]);
function vocabList(){const f=S.vf,picked=[f.a,f.b].filter(k=>CHIP[k]).map(k=>CHIP[k][3]);
  let ids=allWords().filter(id=>(S.stage[id]>0||S.mine.includes(id)||(f.a&&CHIP[f.a]&&CHIP[f.a].kind==="col"))&&picked.every(fn=>fn(id)));
  if(f.sort==="abc")ids.sort((a,b)=>NOTES[a].ko.localeCompare(NOTES[b].ko,"ko"));
  else if(f.sort==="weak")ids.sort((a,b)=>(S.stage[a]||0)-(S.stage[b]||0));
  else ids.reverse();
  return ids}
function chipRow(){const f=S.vf,c=k=>`<button class="chip" data-a="chip" data-v="${k}" aria-pressed="${f.a===k||f.b===k}">${f.a===k||f.b===k?"✓ ":""}${t(1,CHIP[k][1],CHIP[k][2])}</button>`;
  if(!f.a)return`<div class="chiprow" role="group" aria-label="단어 고르기">${[...KNOW,...COLS].map(x=>c(x[0])).join("")}</div>`;
  const other=(CHIP[f.a].kind==="know"?COLS:KNOW).map(x=>x[0]).filter(k=>!f.b||k===f.b);
  return`<div class="chiprow" role="group" aria-label="단어 고르기"><button class="chip x" data-a="chipClear" aria-label="필터 지우기">✕</button>${c(f.a)}${other.map(c).join("")}</div>`}
/* four layouts for the word list, compared with Playwright (prototype/compare-filters.js); S.vfVariant picks one */
const KCNT=k=>allWords().filter(id=>CHIP[k][3](id)&&(S.stage[id]>0||S.mine.includes(id)||CHIP[k].kind==="col")).length;
function studyFoot(ids){const f=S.vf,has=k=>f.a===k||f.b===k;
  if(has("star")&&ids.length)return`<button class="btn pri" data-a="listStudy" data-ids="${ids.join(",")}">${t(1,"별표 단어 복습하기","Review starred words")} (${ids.length})</button>`;
  if(has("weak")&&ids.length)return`<button class="btn pri" data-a="listStudy" data-ids="${ids.join(",")}">${t(1,"잘 모르는 단어 복습하기","Review these words")} (${ids.length})</button>`;return""}
const sortLink=()=>{const o=SORTS.find(x=>x[0]===S.vf.sort);return`<button class="link s" data-a="sortSheet" aria-label="정렬 바꾸기">${t(2,o[1],o[2])} ⌄</button>`};
const emptyMsg=()=>`<p class="center muted">${t(2,"아직 여기에 단어가 없어요.","No words here yet.")}</p>`;
function vocabWords(v,list){const f=S.vf,ids=vocabList(),why=[f.a,f.b].filter(k=>CHIP[k]).map(k=>t(3,CHIP[k][4],CHIP[k][5])).join(" ");
  if(v===1){ /* A. chip row that turns into a second level (Spotify) */
    return{body:`${chipRow()}<div class="listhead"><span class="s"><b>${t(2,`단어 ${ids.length}개`,`${ids.length} words`)}</b></span>${sortLink()}</div>
      ${why?`<p class="xs muted" style="margin:-6px 0 0" data-why>${why}</p>`:""}${list(ids)||emptyMsg()}`,foot:studyFoot(ids)}}
  if(v===2){ /* B. text tabs for how well I know it + one "모아 보기" menu */
    const tabs=[["","전체","All"],...KNOW.map(x=>[x[0],x[1],x[2]])];const kn=KNOW.some(x=>x[0]===f.a)?f.a:"";const col=COLS.find(x=>x[0]===f.b||x[0]===f.a&&!kn);
    return{body:`<div class="tabs" role="tablist">${tabs.map(([k,ko,en])=>`<button role="tab" data-a="v2tab" data-v="${k}" aria-selected="${kn===k}">${t(1,ko,en)}</button>`).join("")}</div>
      <div class="listhead"><button class="link s" data-a="v2col" aria-label="모아 보기">${col?`<b>${t(1,col[1],col[2])}</b> ✕`:t(2,"모아 보기 ⌄","Collections ⌄")}</button><span class="xs muted">${t(2,`${ids.length}개`,`${ids.length}`)}</span>${sortLink()}</div>
      ${why?`<p class="xs muted" style="margin:-6px 0 0" data-why>${why}</p>`:""}${list(ids)||emptyMsg()}`,foot:studyFoot(ids)}}
  if(v===3){ /* C. smart-list cards first (Apple Reminders), tap one → its list */
    if(!f.a){const card=k=>`<button class="slcard" data-a="v3open" data-v="${k}"><span class="slnum">${KCNT(k)}</span><b>${t(1,CHIP[k][1],CHIP[k][2])}</b><span class="xs muted">${t(3,CHIP[k][4],CHIP[k][5])}</span></button>`;
      return{body:`<div class="slgrid">${["weak","known","use","star"].map(card).join("")}</div>
        <div class="glist">${["lesson","mine","paused"].map(k=>`<button class="grow-row" data-a="v3open" data-v="${k}"><span class="fill">${t(1,CHIP[k][1],CHIP[k][2])}</span><span class="val">${KCNT(k)}</span><span class="chev">›</span></button>`).join("")}</div>
        <button class="link s" data-a="v3open" data-v="all" style="align-self:flex-start">${t(2,`배운 단어 전부 보기 (${allWords().filter(id=>S.stage[id]>0||S.mine.includes(id)).length})`,"See every word")} ›</button>`}}
    const name=f.a==="all"?t(2,"배운 단어 전부","All words"):t(1,CHIP[f.a][1],CHIP[f.a][2]),ids3=ids;
    return{body:`<div class="listhead"><button class="link s" data-a="v3back">‹ ${t(1,"모아 보기","Lists")}</button>${sortLink()}</div>
      <h2 style="margin:0">${name} <span class="muted s">${ids3.length}</span></h2>${f.a!=="all"?`<p class="xs muted" style="margin:0" data-why>${t(3,CHIP[f.a][4],CHIP[f.a][5])}</p>`:""}${list(ids3)||emptyMsg()}`,foot:studyFoot(ids3)}}
  /* D. one title menu: "전체 단어 ⌄" opens a sheet with every list explained */

   <input type="search" id="q" placeholder="${t(2,"찾기 (한국어·영어)","Search (Korean or English)")}" aria-label="단어 찾기" value="${esc(q)}">${body}`,foot,

   <rect x="52" y="112" width="44" height="48" rx="6" fill="#fff" stroke="#8a8a8a"/><path d="M96 124c14 0 14 22 0 22" fill="none" stroke="#8a8a8a" stroke-width="4"/><rect x="56" y="118" width="36" height="10" fill="#8b5e3c"/>

   <path d="M278 90h30v70h-30z M278 90l15-18 15 18" fill="#fff" stroke="#8a8a8a"/><rect x="282" y="110" width="22" height="16" fill="#5a8bb0"/>
   <ellipse cx="180" cy="205" rx="60" ry="14" fill="#fff" stroke="#8a8a8a"/><path d="M150 200l30-34 30 34z" fill="#f6d9e3" stroke="#8a8a8a"/><circle cx="180" cy="168" r="6" fill="#d33"/></svg>`}

V.sceneQuiz=(p)=>{const s=anySet(p.set),sc=SCENES[s.id],q=S.sceneQuiz;const n=NOTES[q.order[q.i]];

   ${sceneBlock(s,true)}${q.picked?`<div class="res ${q.ok?"ok":"bad"}">${q.ok?t(1,"맞았어요","Correct"):t(2,"여기예요 · 조금 뒤에 다시 물어볼게요","It's here · asked again soon")}</div>`:`<p class="center xs muted" style="margin:0">${t(3,"그림에서 눌러 보세요","Tap it in the picture")}</p>`}`,

V.progress=()=>{const known=allWords().filter(id=>S.stage[id]>=2).length;const gain=S.weekWords.length;
  const days=t(2,["월","화","수","목","금","토","일"],["M","T","W","T","F","S","S"]),studied=[1,1,0,1,S.studiedToday||S.todayDone?1:0,0,0],today=4;

    <div class="week">${days.map((d,i)=>`<div><i class="${studied[i]?"on":""} ${i===today?"today":""}" aria-label="${d} ${studied[i]?"공부함":"안 함"}"></i>${d}</div>`).join("")}</div></div>
   <div class="card"><div style="display:flex;justify-content:space-between"><b>${esc(step)}</b><span class="s muted">${t(2,"세트","set")} ${si+1} / ${inStep.length}</span></div>
    ${!S.pathOpen&&si>1?`<p class="xs muted" style="margin:0">✓ ${t(2,`앞의 세트 ${si-1}개 완료`,`${si-1} earlier sets done`)}</p>`:""}

    <p class="xs muted" style="margin:0">${t(2,"다음 단계","Next")}: ${steps.slice(steps.indexOf(step)+1).map(esc).join(" → ")} → 새싹 1</p></div>

let mineSeq=1;
function addWord(ko,en,exko){const id="u"+String(mineSeq++).padStart(4,"0");
  NOTES[id]={id,kind:"word",ko,yo:"",en:en||t(3,"(뜻은 AI가 채워 드려요 · 7단계)","(AI fills in the meaning · stage 7)"),pos:"",usage:"",contract:"",pron:"",roman:"",explain:"",video_url:"",video_title:"",phrases:[],dict_examples:[],

  S.mine.push(id);S.stage[id]=0;S.pass[id]=0;return id}
V.addOne=(p)=>({top:`${backBtn}<h1>${t(2,"단어 하나 넣기","Add a word")}</h1>`,
  html:`<label class="s" for="a1">${t(1,"단어","Word")}</label><input type="text" id="a1" lang="ko" value="${esc(p.ko||"")}" placeholder="예: 편의점">
   <label class="s" for="a2">${t(1,"뜻","Meaning")} <span class="muted">(${t(2,"비워도 돼요","optional")})</span></label><input type="text" id="a2" placeholder="convenience store">
   <label class="s" for="a3">${t(1,"예문","Example")} <span class="muted">(${t(2,"선택","optional")})</span></label><input type="text" id="a3" lang="ko" placeholder="편의점에서 물을 사요.">
   <p class="xs muted" style="margin:0">${t(3,"뜻이나 예문을 비우면 AI가 채우고, 선생님이 나중에 확인해요.","Leave meaning or example empty and AI fills it in; your teacher checks it later.")}</p>`,
  foot:`<button class="btn pri" data-a="addOneSave">${t(1,"넣기","Add")}</button>`});
function parseList(txt){const s=txt.trim();if(!s)return[];
  if(/^[\[{]/.test(s)){try{const j=JSON.parse(s);const arr=Array.isArray(j)?j:j.words||[];return arr.map(o=>({ko:(o.ko||o.korean||o.word||"").trim(),en:(o.en||o.meaning||o.english||"").trim()}))}catch{return[{ko:"",en:"",err:"JSON 형식이 맞지 않아요"}]}}
  return s.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const c=l.split(/\t|,|=| - /).map(x=>x.trim());const h=x=>/[가-힣]/.test(x||"");
    return !h(c[0])&&h(c[1])?{ko:c[1],en:c[0]}:{ko:c[0]||"",en:c[1]||""}})
    .filter(r=>!/^(ko|korean|단어|word)$/i.test(r.ko))}
const okRow=r=>/[가-힣]/.test(r.ko)&&!r.err;

   ${rows.length?`<div class="card s"><b>${t(2,"미리 보기","Preview")} · ${t(2,`${good.length}개 넣을 수 있어요`,`${good.length} ready`)}${rows.length-good.length?` · ${t(2,`${rows.length-good.length}개는 확인 필요`,`${rows.length-good.length} need a look`)}`:""}</b>
     <div class="rows">${rows.slice(0,30).map(r=>`<div><span class="grow">${esc(r.ko)||"—"} <span class="muted">${esc(r.en)}</span></span><span class="xs ${okRow(r)?"muted":""}">${okRow(r)?"✓":r.err||t(2,"한국어 단어가 없어요","no Korean word")}</span></div>`).join("")}</div></div>`:""}
   <button class="link" data-a="aiHelp" style="align-self:flex-start">${t(2,"형식이 달라요 → AI로 바꾸는 법","Different format? → let AI convert it")}</button>
   ${p.ai?`<div class="card s"><b>${t(2,"ChatGPT·Claude에 이렇게 부탁하세요","Ask ChatGPT or Claude like this")}</b><span id="prompt">아래 단어 목록을 "한국어 단어, 영어 뜻" 형식으로 한 줄에 하나씩 바꿔 줘. 다른 말은 쓰지 마. / Convert the word list below to "Korean word, English meaning", one per line. Nothing else.</span><button class="btn" data-a="copyPrompt">${t(1,"복사","Copy")}</button><span class="xs muted">${t(3,"바뀐 결과를 위 칸에 붙여 넣으면 돼요. 어려우면 '선생님께 부탁하기'를 쓰세요.","Paste the result above. Too hard? Use 'Ask the teacher'.")}</span></div>`:""}`,

    return`<div class="sheet-bg" data-a="closeSheet"><div class="sheet" role="dialog" aria-label="단어 고르기" data-stop style="max-height:85%;overflow:auto">
    <div class="sheet-head"><b>${t(2,"어떤 단어를 볼까요?","Which words?")}</b><button class="link" data-a="closeSheet">${t(1,"닫기","Close")}</button></div>
    <div class="rows">${row("","배운 단어 전부","All words","",allWords().filter(id=>S.stage[id]>0||S.mine.includes(id)).length)}</div>
    <div class="grp">${t(2,"얼마나 아는지","How well I know it")}</div><div class="rows">${KNOW.map(x=>row(x[0],x[1],x[2],t(3,x[4],x[5]),KCNT(x[0]))).join("")}</div>
    <div class="grp">${t(2,"모아 보기","Collections")}</div><div class="rows">${COLS.map(x=>row(x[0],x[1],x[2],t(3,x[4],x[5]),KCNT(x[0]))).join("")}</div></div></div>`},
  sort:()=>`<div class="sheet-bg" data-a="closeSheet"><div class="sheet" role="dialog" aria-label="정렬" data-stop>
    <div class="sheet-head"><b>${t(2,"정렬","Sort")}</b><button class="link" data-a="closeSheet">${t(1,"닫기","Close")}</button></div>
    <div class="rows">${SORTS.map(o=>`<button data-a="sortSet" data-v="${o[0]}" aria-pressed="${S.vf.sort===o[0]}"><span class="grow">${t(2,o[1],o[2])}</span>${S.vf.sort===o[0]?"✓":""}</button>`).join("")}</div></div></div>`,
  noteMenu:()=>{const id=S.params.id;return`<div class="sheet-bg" data-a="closeSheet"><div class="sheet" role="dialog" aria-label="단어 메뉴" data-stop>
    <div class="rows"><button data-a="pause" data-id="${id}">${S.paused[id]?t(2,"다시 복습하기","Review again"):t(2,"복습에서 빼기 (이미 잘 아는 단어)","Remove from reviews (I know it well)")}</button>
    <button data-a="memo" data-id="${id}">${t(1,"메모","Note")}</button><button data-a="write" data-id="${id}">${t(2,"이 단어로 문장 써보기","Write a sentence")}</button></div>
    <button class="link" data-a="closeSheet" style="margin-top:6px">${t(1,"닫기","Close")}</button></div></div>`},
  memo:()=>{const id=S.params.id;return`<div class="sheet-bg" data-a="memoCancel"><div class="sheet" role="dialog" aria-label="메모" data-stop>
    <div class="sheet-head"><button class="link" data-a="memoCancel">${t(1,"취소","Cancel")}</button><b>${t(2,"내 메모","My note")}</b><button class="link strong" data-a="memoSave" data-id="${id}" disabled>${t(1,"저장","Save")}</button></div>
    ${S.memoConfirm?`<div class="res warn" style="display:flex;gap:8px;align-items:center;justify-content:space-between">${t(2,"쓴 내용을 버릴까요?","Discard your changes?")}<span><button class="link" data-a="memoDiscard">${t(1,"버리기","Discard")}</button><button class="link strong" data-a="memoKeep">${t(1,"계속 쓰기","Keep writing")}</button></span></div>`:""}
    <textarea id="memo" aria-label="메모" placeholder="${t(2,"예: 수업에서 '이게'로 줄여 말함","e.g. In class we said '이게'")}">${esc(S.memoDraft??S.memo[id]??"")}</textarea></div></div>`},
};

/* ---------- actions ---------- */
function act(a,el){const d=el?el.dataset:{};const s=S.session;log("tap:"+a);
  switch(a){
  case"codeOk":{const v=$("#code").value.trim();if(!v){toast(t(2,"코드를 넣어 주세요","Please enter your code"));return}S.code=v;go("diag",{i:0},false);break}
  case"dk":{const i=(S.params.i||0)+1;if(i>=12){S.diagDone=true;go("notice",{},false)}else go("diag",{i},false);break}
  case"diagSkip":go("notice",{},false);break;
  case"notiYes":case"notiNo":S.settings.notiOn=a==="notiYes";log("firstRunDone");home();break;
  case"menu":S.sheet="menu";render();break;
  case"addMenu":S.sheet="addMenu";render();break;
  case"noteMenu":S.sheet="noteMenu";render();break;
  case"exPrev":case"exNext":{const tr=el.closest("[data-exs]").querySelector(".track");tr.scrollBy({left:(a==="exNext"?1:-1)*(tr.children[0].offsetWidth+8),behavior:"smooth"});break}
  case"exAll":S.sheet="exAll";render();break;
  case"chip":{const f=S.vf;if(f.a===d.v){f.a=f.b;f.b="";}else if(f.b===d.v)f.b="";else if(!f.a)f.a=d.v;else f.b=d.v;render();break}
  case"v2tab":{const col=COLS.some(x=>x[0]===S.vf.a)?S.vf.a:S.vf.b;S.vf.a=d.v||(col||"");S.vf.b=d.v&&col?col:"";if(!d.v&&col){S.vf.a=col;S.vf.b=""}render();break}
  case"v2col":{const kn=KNOW.some(x=>x[0]===S.vf.a)?S.vf.a:"";const col=COLS.some(x=>x[0]===S.vf.a)?S.vf.a:S.vf.b;if(col){S.vf.a=kn;S.vf.b="";render()}else{S.sheet="v2col";render()}break}
  case"v2colSet":{const kn=KNOW.some(x=>x[0]===S.vf.a)?S.vf.a:"";if(kn){S.vf.b=d.v}else{S.vf.a=d.v;S.vf.b=""}S.sheet=null;render();break}
  case"v3open":S.vf.a=d.v;S.vf.b="";render();$("#screen").scrollTop=0;break;
  case"v3back":S.vf.a="";S.vf.b="";render();break;
  case"v4menu":S.sheet="v4menu";render();break;
  case"v4set":S.vf.a=d.v;S.vf.b="";S.sheet=null;render();break;
  case"spot":S.sceneOpen=S.sceneOpen===d.id?null:d.id;{const y=$("#screen").scrollTop;render();$("#screen").scrollTop=y}break;
  case"sceneQuizStart":{const sc=SCENES[d.set];const ids=sc.spots.map(x=>x.id).filter(id=>S.stage[id]>=1).sort(()=>Math.random()-.5);S.sceneQuiz={set:d.set,order:ids,i:0,picked:null,ok:null,show:null,wrong:[]};S.sceneOpen=null;go("sceneQuiz",{set:d.set});break}
  case"scenePick":{const q=S.sceneQuiz;if(q.picked)break;const want=q.order[q.i];q.picked=d.id;q.ok=d.id===want;q.show=want;if(!q.ok)q.wrong.push(want);log(`scene:${want}:${q.ok?"good":"again"}`);if(q.ok)S.studiedToday=true;render();break}
  case"sceneNext":{const q=S.sceneQuiz;q.i++;q.picked=q.ok=q.show=null;if(q.i>=q.order.length&&q.wrong.length){q.order.push(...q.wrong);q.wrong=[]}
    if(q.i>=q.order.length){const set=q.set;S.sceneQuiz=null;back();toast(t(2,"그림 퀴즈 끝! 오늘 공부한 걸로 기록했어요","Picture quiz done · counted for today"))}else render();break}
  case"sceneQuit":S.sceneQuiz=null;back();break;
  case"chipClear":S.vf.a="";S.vf.b="";render();break;
  case"sortSheet":S.sheet="sort";render();break;
  case"sortSet":S.vf.sort=d.v;S.sheet=null;render();break;
  case"closeSheet":S.sheet=null;render();break;
  case"nav":S.history=[{screen:"home",params:{}}];go(d.to,{},false);break;
  case"open":go(d.to);break;
  case"plus":go("plus");break;
  case"plusJoin":S.plan="month";render();toast(t(2,"플러스 회원이 됐어요 (프로토타입)","You're Plus now (prototype)"));break;
  case"toLifetime":S.plan="life";render();toast(t(2,"평생 회원이 됐어요 (프로토타입)","You're a lifetime member (prototype)"));break;
  case"manageSub":toast(t(2,"결제 관리는 4단계에서 연결돼요","Billing management comes in stage 4"));break;
  case"community":toast(t(2,"커뮤니티는 곧 나와요","Community is coming soon"));break;
  case"inbox":go("inbox");break;
  case"openMsg":{const m=S.inbox.find(x=>x.id==d.id);m.isNew=false;log("openMsg:"+m.id);m.go.to==="set"?go("set",{set:m.go.set}):go("note",{id:m.go.id});break}
  case"startToday":S.newSetSeen=true;startSession("today");break;
  case"sound":toast("🔈 (3단계에서 실제 소리)");break;
  case"video":log("video:youtube");break;
  case"reveal":go("a",{},false);break;
  case"check":{const c=cur(),n=NOTES[c.id];s.input=($("#inp")||{}).value||"";if(!s.input.trim()){toast(t(3,"답을 써 주세요. 모르면 '모르겠어요'","Type an answer, or tap 'I don't know'"));return}
    s.graded=grade(s.input,c.dir==="cloze"?ex(n,1).cloze:ans(n));submit(s.graded.r==="bad"?"bad":s.hint?"hard":s.graded.r);go("a",{},false);break}
  case"dunno":s.input="";s.graded={r:"bad",dunno:true};submit("bad");go("a",{},false);break;
  case"hint":s.hint=true;render();break;
  case"self":submit(d.v);nextCard();break;
  case"next":nextCard();break;
  case"meetNext":submit("seen");nextCard();break;
  case"meetKnown":submit("known");toast(t(3,"알겠어요. 몇 주 뒤에 한 번만 확인할게요","Got it. We'll check it once in a few weeks"),2200);nextCard();break;
  case"undo":{const u=s.undo;s.i=u.i;s.queue=u.queue.slice(0,u.len);s.results.length=u.res;const id=cur().id;S.stage[id]=u.stage;S.pass[id]=u.pass;S.assumed[id]=u.assumed;S.weekWords.length=u.ww;s.undo=null;s.input="";s.hint=false;s.graded=null;go("q",{},false);break}
  case"stop":{const n=doneCount(s);S.session=null;if(s.kind==="today"){home()}else{S.history=s.ret.history;go(s.ret.screen,s.ret.params,false)}toast(n?t(2,`단어 ${n}개까지 저장했어요`,`Saved ${n} words`):t(2,"다음에 이어서 해요","Continue next time"));break}
  case"detail":go("note",{id:d.id,fromSession:!!S.session});break;
  case"back":back();break;
  case"home":home();break;
  case"showMeaning":S.params.shown=true;render();break;
  case"noteSelf":{const id=S.params.id;S.params.graded=d.v;S.widgetToday[id]=d.v;S.studiedToday=true;if(d.v==="bad")S.pass[id]=0;log(`result:${id}:widget:${d.v}`);render();break}
  case"widgetMore":S.params.more=true;render();break;
  case"widgetClose":home();break;
  case"widgetStart":startSession("today");break;
  case"noteReview":startSession("note",{id:d.id});break;
  case"listStudy":startSession("list",{ids:d.ids.split(",")});break;
  case"openSet":go("set",{set:d.set});break;
  case"setStudy":startSession("set",{set:d.set});break;
  case"vview":S.vocabView=d.v;render();break;
  case"pathToggle":S.pathOpen=!S.pathOpen;render();break;
  case"lang":S.settings.lang=d.v;log("setting:lang="+d.v);{const y=$("#screen").scrollTop;render();$("#screen").scrollTop=y}break;
  case"star":if(!S.sheet){const y=$("#screen").scrollTop;S.starred[d.id]=!S.starred[d.id];render();$("#screen").scrollTop=y;toast(S.starred[d.id]?t(2,"별표했어요 · 단어장 ⭐ 별표에 모여요","Starred · find it under ⭐ in Words"):t(2,"별표를 뺐어요","Unstarred"));break}
    S.starred[d.id]=!S.starred[d.id];S.sheet=null;render();toast(S.starred[d.id]?t(2,"별표했어요 · 단어장에서 모아 볼 수 있어요","Starred · see them in Words"):t(2,"별표를 뺐어요","Unstarred"));break;
  case"pause":S.paused[d.id]=!S.paused[d.id];S.sheet=null;render();toast(S.paused[d.id]?t(2,"복습에서 뺐어요 · 단어장 '뺀 단어'에 있어요","Removed from reviews · see 'Removed' in Words"):t(2,"다시 복습에 나와요","Back in reviews"));break;
  case"memo":S.sheet="memo";render();$("#memo").focus();break;
  case"memoSave":S.memo[d.id]=$("#memo").value;S.memoDraft=null;S.memoConfirm=false;S.sheet=null;render();toast(t(2,"메모를 저장했어요","Note saved"));break;
  case"memoCancel":{const id=S.params.id,v=$("#memo")?$("#memo").value:"";if(v!==(S.memo[id]||"")&&!S.memoConfirm){S.memoDraft=v;S.memoConfirm=true;render();break}S.memoDraft=null;S.memoConfirm=false;S.sheet=null;render();break}
  case"memoDiscard":S.memoDraft=null;S.memoConfirm=false;S.sheet=null;render();break;
  case"memoKeep":S.memoConfirm=false;render();$("#memo").focus();break;
  case"write":go("write",{id:d.id});break;
  case"writeSubmit":{const v=$("#wr").value.trim();if(!v){toast(t(2,"문장을 써 주세요","Write a sentence first"));return}S.writing[d.id]={text:v};render();break}
  case"addOne":go("addOne",{ko:d.ko||""});break;
  case"addOneSave":{const ko=$("#a1").value.trim();if(!/[가-힣]/.test(ko)){toast(t(2,"한국어 단어를 넣어 주세요","Enter a Korean word"));return}
    const id=addWord(ko,$("#a2").value.trim(),$("#a3").value.trim());back();toast(t(2,`'${ko}' 넣었어요 · 내일부터 공부에 나와요`,`Added '${ko}' · it starts tomorrow`),2200);log("added:"+id);break}
  case"addMany":go("addMany",{});break;
  case"addManyCheck":{const v=$("#am").value;S.params.txt=v;S.params.rows=parseList(v);if(!S.params.rows.length){toast(t(2,"단어를 붙여 넣어 주세요","Paste some words first"));return}render();break}
  case"addManySave":{const good=S.params.rows.filter(okRow);good.forEach(r=>addWord(r.ko,r.en,""));back();toast(t(2,`${good.length}개 넣었어요 · '내가 넣은 단어'에 있어요`,`Added ${good.length} · see 'Added by me'`),2200);log("addedMany:"+good.length);break}
  case"aiHelp":S.params.ai=true;S.params.txt=$("#am").value;render();break;
  case"copyPrompt":{const v=$("#prompt").textContent;navigator.clipboard?.writeText(v).then(()=>toast(t(1,"복사했어요","Copied")),()=>toast(t(2,"길게 눌러 복사해 주세요","Press and hold to copy")));break}
  case"ask":go("ask",{});break;
  case"askSend":{S.params.sent=true;S.requests.push({at:Date.now()});S.inbox.unshift({id:100+S.requests.length,isNew:false,from:"나",text:"단어 넣기 부탁을 보냈어요 · 처리 중",date:"오늘",go:{to:"set",set:"MINE"}});render();break}
  case"npd":S.settings.newPerDay=+d.v;log("setting:newPerDay="+d.v);render();break;
  case"backup":toast(t(2,"3단계에서 동작해요","Works from stage 3"));break;
  case"logout":reset();break;
  }
}
function reset(){Object.assign(S,{screen:"start",params:{},history:[],code:"",session:null,todayDone:false,sheet:null,widgetToday:{}});render()}
document.addEventListener("click",e=>{const tg=e.target.closest("[data-a]");if(!tg||!$("#phone").contains(tg))return;
  if(tg.dataset.a==="closeSheet"&&e.target.closest("[data-stop]")&&!e.target.closest("button"))return;act(tg.dataset.a,tg)});
$("#simNoti").onclick=()=>{if(!S.code)return toast("먼저 코드를 넣어 주세요");S.session=null;log("enter:noti");home()};
$("#simWidget").onclick=()=>{if(!S.code)return toast("먼저 코드를 넣어 주세요");S.session=null;S.history=[];const id=plan().due[0]||SETS[0].word_ids[0];log("enter:widget");go("note",{id,hide:true,from:"widget"},false)};
$("#simPlan").onclick=()=>{const order=["free","month","year","life","class"];S.plan=order[(order.indexOf(S.plan)+1)%order.length];render();toast(isPlus()?`플러스(${PLAN_NAME[S.plan][0]}) 화면으로 바꿨어요`:"무료 회원 화면으로 바꿨어요")};
$("#simReset").onclick=reset;
render();
</script>

</html>
