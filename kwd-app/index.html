<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>kwd 화면 흐름 프로토타입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* ===== THEME (Stage 1 grey box). Every color / font / size lives here; screens never hard-code them. =====
   Layout idea: one thing per screen. One big action at the bottom, small extras in corners. */
:root{
  --bg:#e9ebee; --phone:#f9fafb; --surface:#ffffff; --box:#eceef1; --line:#d3d8dd;
  --text:#1c2126; --muted:#69727b; --accent:#2f353b; --on-accent:#ffffff;
  --ok:#2c7a4c; --ok-bg:#e2f1e7; --bad:#b0443b; --bad-bg:#f6e3e1; --warn:#86660f; --warn-bg:#f5eed6;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --fs-xs:13px; --fs-s:15px; --fs-m:17px; --fs-l:22px; --fs-xl:30px; --fs-word:46px;
  --r:14px; --tap:56px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171a; --phone:#1b1f23; --surface:#23282d; --box:#2a3036; --line:#3a4148;
  --text:#e7eaed; --muted:#9ba4ac; --accent:#dfe3e7; --on-accent:#14171a;
  --ok:#80cb9d; --ok-bg:#1e3327; --bad:#e8958c; --bad-bg:#3b2422; --warn:#e3c56b; --warn-bg:#3a321a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171a; --phone:#1b1f23; --surface:#23282d; --box:#2a3036; --line:#3a4148;
  --text:#e7eaed; --muted:#9ba4ac; --accent:#dfe3e7; --on-accent:#14171a;
  --ok:#80cb9d; --ok-bg:#1e3327; --bad:#e8958c; --bad-bg:#3b2422; --warn:#e3c56b; --warn-bg:#3a321a; color-scheme:dark}
/* ===== end THEME ===== */

html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs-m);line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.phone{width:100%;max-width:420px;height:min(860px,calc(100dvh - 80px));background:var(--phone);border:1px solid var(--line);
  border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.bar-top{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 10px}
.bar-top h1{font-size:var(--fs-l);margin:0;flex:1}
.icon{width:44px;height:44px;border:none;background:none;border-radius:12px;cursor:pointer;font-size:22px;line-height:1;color:var(--muted);display:grid;place-items:center}
.icon:hover{background:var(--box)}
.screen{flex:1;overflow-y:auto;padding:8px 20px 20px;display:flex;flex-direction:column;gap:14px}
.screen>*{flex-shrink:0}
.screen>.fill{flex-shrink:1}
.fill{flex:1}
.center{text-align:center}
.foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:stretch}
.btn{min-height:var(--tap);border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:0 18px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700;font-size:var(--fs-l)}
.btn.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.btn.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:700}
.link{border:none;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px;padding:0 8px;font-size:var(--fs-s)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.muted{color:var(--muted)} .s{font-size:var(--fs-s)} .xs{font-size:var(--fs-xs)}
.hero{font-size:var(--fs-xl);font-weight:700;line-height:1.3;text-wrap:balance}
.word{font-size:var(--fs-word);font-weight:700;line-height:1.2;word-break:keep-all;text-align:center}
.mean{font-size:var(--fs-l);text-align:center}
.prog{height:6px;background:var(--box);border-radius:99px;overflow:hidden;flex:1}
.prog>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.ex b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.blank{display:inline-block;min-width:3em;border-bottom:2px solid var(--text);margin:0 2px}
.res{border-radius:var(--r);padding:12px 16px;font-weight:700;text-align:center}
.res.ok{background:var(--ok-bg);color:var(--ok)} .res.bad{background:var(--bad-bg);color:var(--bad)} .res.warn{background:var(--warn-bg);color:var(--warn)}
.tag{display:inline-block;font-size:var(--fs-xs);border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--muted)}
input[type=text],input[type=search],input[type=time],textarea{width:100%;min-height:var(--tap);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 14px;font-size:var(--fs-l)}
input[type=search]{font-size:var(--fs-m)}
textarea{min-height:100px;font-size:var(--fs-m)}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rows>button,.rows>div{display:flex;gap:10px;align-items:center;min-height:56px;padding:8px 4px;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.rows .grow{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);flex:none}
.dot.s1{background:linear-gradient(90deg,var(--muted) 50%,transparent 50%)} .dot.s2,.dot.s3,.dot.s4{background:var(--muted)}
.dot.s3{border-color:var(--text);background:var(--text)} .dot.s4{border-color:var(--ok);background:var(--ok)}
.more{display:flex;flex-direction:column;gap:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal i{aspect-ratio:1;border-radius:4px;background:var(--box);max-width:100%}
.cal i.on{background:var(--muted)}
.lvl{height:10px;background:var(--box);border-radius:99px;overflow:hidden}.lvl>i{display:block;height:100%;background:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:none;background:var(--surface);min-height:44px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.set-row{display:flex;align-items:center;gap:10px;min-height:56px}
.switch{width:52px;height:32px;flex:none;appearance:none;border-radius:99px;background:var(--line);position:relative;cursor:pointer;border:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch:checked{background:var(--accent)} .switch:checked::after{left:23px}
.sheet-bg{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.28);display:flex;align-items:flex-end}
.sheet{background:var(--phone);width:100%;border-radius:22px 22px 0 0;padding:10px 20px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.sheet .rows>button{font-size:var(--fs-m)}
.toast{position:absolute;left:20px;right:20px;top:60px;z-index:30;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:12px 16px;font-size:var(--fs-s);text-align:center}
.sim{font-size:var(--fs-xs);color:var(--muted);display:flex;gap:2px;justify-content:center;align-items:center;white-space:nowrap}
.sim .link{min-height:36px;font-size:var(--fs-xs)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:var(--fs-xs);color:var(--muted)}
.week i{display:block;width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);margin:0 auto 4px}
.week i.on{background:var(--accent);border-color:var(--accent)} .week i.today{border-color:var(--accent);border-width:3px}
.path>div{display:flex;gap:12px;align-items:center;min-height:42px}
.mark{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none;color:var(--on-accent)}
.mark.done{background:var(--accent);border-color:var(--accent)} .mark.now{border:4px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 14px;background:var(--surface);cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.bell{position:relative}.bell.on::after{content:"";position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.newdot{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none}
.newdot.off{background:transparent}
.grp{font-size:var(--fs-xs);color:var(--muted);letter-spacing:.04em;margin-top:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-inline:-20px;padding-inline:20px}
.chips.scroll .chip{flex:none}
.video{aspect-ratio:16/9;max-width:100%;border-radius:12px;background:var(--box);border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:28px;color:var(--muted)}
.widget-prev{align-self:center;width:170px;max-width:100%;aspect-ratio:1;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:12px}
.sel{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 10px}
.plus{display:inline-block;font-size:var(--fs-xs);font-weight:700;border:1px solid var(--warn);color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:0 8px;white-space:nowrap}
.filter-row{display:flex;align-items:center;gap:8px}
.btn.sm{min-height:40px;padding:0 14px;font-size:var(--fs-s)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:12px;margin-left:4px}
.chip.on{background:var(--box)}
/* chip row (word list) */
.chiprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding:6px 20px;scroll-snap-type:x proximity}
.chiprow::-webkit-scrollbar{display:none}
.chiprow .chip{flex:none;min-height:36px;padding:0 14px;font-size:var(--fs-s);scroll-snap-align:start}
.chiprow .chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chiprow .chip.x{width:36px;padding:0;display:grid;place-items:center}
.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 0;font:inherit;font-size:var(--fs-s);color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);font-weight:700;border-bottom-color:var(--accent)}
.slgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;min-height:104px}
.slcard .slnum{font-size:26px;font-weight:700;line-height:1}
.titlemenu{background:none;border:0;font:inherit;font-size:var(--fs-l);font-weight:700;color:var(--text);padding:6px 0;cursor:pointer}
.scene{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.scene-art{display:block;width:100%;height:auto}
.spot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.spot i{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 0 0 0 rgba(47,53,59,.45);animation:ripple 1.8s infinite}
.spot.good i{background:#3c9a5f;border-color:#3c9a5f;animation:none}.spot.bad i{background:#c0392b;border-color:#c0392b;animation:none}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(47,53,59,.45)}70%{box-shadow:0 0 0 14px rgba(47,53,59,0)}100%{box-shadow:0 0 0 0 rgba(47,53,59,0)}}
@media (prefers-reduced-motion:reduce){.spot i{animation:none}}
.minicard{position:absolute;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;gap:0;box-shadow:0 4px 14px rgba(0,0,0,.15);font:inherit;color:inherit;cursor:pointer;min-width:110px}
.minicard b{font-size:var(--fs-l)}
.listhead{display:flex;align-items:center;justify-content:space-between;min-height:36px}
.link.strong{font-weight:700}.link:disabled{opacity:.35;cursor:default}
/* grouped settings list (iOS-style inset groups) */
.lprev{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.lprev mark{background:#ffe680;color:#1c2126;border-radius:3px;padding:0 2px}
.lp-word{font-size:26px;font-weight:700}.lp-mean{color:var(--muted)}
.lp-card{align-self:stretch;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;font-size:var(--fs-s)}
.lp-btn{align-self:stretch;text-align:center;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:10px;font-weight:700}
.glabel mark{background:#ffe680;color:#1c2126;border-radius:3px;padding:0 3px}
.glabel{font-size:var(--fs-xs);color:var(--muted);margin:14px 16px 6px}
.glist{background:var(--surface);border-radius:12px;border:1px solid var(--line);overflow:hidden}
.glist>.grow-row{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 16px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;font:inherit;color:inherit}
.glist>.grow-row:first-child{border-top:0}
button.grow-row{cursor:pointer}
.grow-row .val{color:var(--muted);font-size:var(--fs-s)}
.grow-row .chev{color:var(--muted)}
.gfoot{font-size:var(--fs-xs);color:var(--muted);margin:6px 16px 0;line-height:1.45}
.glist>.grow-row.danger{color:#c0392b}
.glist input.timepill,.glist select.timepill{width:auto;min-height:0;height:auto;flex:none;margin:0;border:0;padding:6px 10px;font-size:var(--fs-s);background:var(--box);border-radius:8px}
.timepill{font:inherit;font-size:var(--fs-s);border:0;background:var(--box);color:var(--text);border-radius:8px;padding:6px 10px}
/* examples: one card, next one peeking, counter + arrows below */
.exc{display:flex;flex-direction:column;gap:8px}
.exc .track{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:-20px;padding:0 20px;scroll-padding-inline:20px;overscroll-behavior-x:contain}
.exc .track::-webkit-scrollbar{display:none}
.exc .slide{flex:0 0 calc(100% - 32px);scroll-snap-align:start;scroll-snap-stop:always;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;position:relative;box-sizing:border-box}
.exc .slide .ko{font-size:var(--fs-m);line-height:1.5;padding-right:40px}
.exc .slide .play{position:absolute;top:4px;right:4px}
.exc .slide.more{align-items:center;justify-content:center;background:var(--box)}
.exc .nav{display:flex;align-items:center;justify-content:space-between}
.exc .dots{display:flex;gap:6px;align-items:center}
.exc .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.exc .dots i.on{width:18px;border-radius:3px;background:var(--accent)}
.exc .arrows{display:flex;align-items:center;gap:2px}
.exc .nav.center{justify-content:center;gap:6px;position:relative;min-height:44px}
.exc .nav.center .cnt-r{position:absolute;left:0}
.exc .nav.center .icon.sm{width:44px;height:44px}
.exc .slide:not(.cur){cursor:pointer}
.exc.v4 .edge{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);z-index:2;font-size:20px;display:grid;place-items:center;cursor:pointer}
.exc.v4{position:relative}.exc.v4 .edge.l{left:-12px}.exc.v4 .edge.r{right:-4px}
.exc.v3 .slide .pg,.exc.v4 .slide .pg{position:absolute;right:12px;bottom:8px}
.seg.know button{display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.2;padding:6px 2px}
.seg.know button .xs{opacity:.75}
.seg.know button span:first-child{font-size:var(--fs-s);white-space:nowrap}
[aria-label="모아 보기"] .chip{min-height:34px;padding:2px 12px;font-size:var(--fs-s)}
.icon.star[aria-pressed="true"]{color:var(--accent)}
.ph{display:flex;flex-direction:column;gap:0;padding:6px 0;border-top:1px solid var(--line)}
.ph:first-of-type{border-top:0}
.ph{gap:2px}
.exs{display:flex;flex-direction:column;gap:6px}.exs-head{display:flex;align-items:center;gap:8px}
.exs .track{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.exs .track::-webkit-scrollbar{display:none}
.exs .track>.ex{flex:0 0 100%;scroll-snap-align:start;box-sizing:border-box;margin:0}
.icon.sm{width:36px;height:36px;min-height:36px;font-size:20px}
.fgrp{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.langs{display:flex;flex-direction:column;gap:8px}
.setlist{display:flex;flex-direction:column}.setlist>.set-row{border-bottom:1px solid var(--line);padding:6px 0;min-height:52px}
.set-hint{margin:-4px 0 4px}.link-row{background:none;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;align-items:center;gap:8px}
.lang{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 14px;cursor:pointer}
.lang[aria-checked="true"]{border:2px solid var(--accent)}
.price{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.price>div{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:4px}
@media (max-width:480px){
  body{padding-block:0}
  .phone{height:calc(100dvh - 44px);border-radius:0;border-left:none;border-right:none;max-width:none;
    margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));width:calc(100% + 2 * max(16px,env(safe-area-inset-left,0px)))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="phone" id="phone" aria-label="학생 앱">
    <div id="top"></div>
    <div class="screen" id="screen"></div>
    <div id="foot"></div>
    <div id="sheet"></div>
    <div class="toast" id="toast" role="status" hidden></div>
  </div>
  <div class="sim">테스트용:
    <button class="link" id="simNoti">알림 탭</button>·<button class="link" id="simWidget">위젯 탭</button>·<button class="link" id="simPlan">무료로 보기 중</button>·<button class="link" id="simReset">처음부터</button>
  </div>
</div>

hings like this happen.","nuance_ko":"위로하거나 인생 이야기할 때","source":"common usage"},{"ko":"살다 살다 (별일 다 보네)","example":"살다 살다 이런 날씨는 처음이에요.","literal":"\"living and living\"","en_equiv":"close: never in all my life","meaning_en":"I've never seen anything like this in my life.","nuance_ko":"아주 놀랄 때, 어이없을 때","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"삼대가 한집에서 산다.","en":"Three generations live in one house.","src":"우리말샘"},{"ko":"고래는 물에 사는 짐승이다.","en":"Whales are animals that live in water.","src":"우리말샘"},{"ko":"그는 하루 종일 연구실에서 산다.","en":"He practically lives in the lab all day.","src":"우리말샘"}],"explain_en":"The ㄹ in '살다' often drops: 사는 곳, 삽니다, 사세요. So '어디 사세요?' (Where do you live?) sounds exactly like '사세요' from 사다 in '이거 사세요!' (Please buy this!)."},{"id":"n00221","kind":"word","ko":"없다","yo":"없어요","en":"to not have / to not exist","pos":"형용사","usage":"","contract":"","examples":[{"id":"e00083","ko":"오늘은 시간이 없어요.","en":"I don't have time today.","speech_level":"해요","cloze":"없어요","extra_word":"시간 = time","extra_grammar":""},{"id":"e00084","ko":"저는 형제가 없어요.","en":"I don't have any siblings.","speech_level":"해요","cloze":"없어요","extra_word":"형제 = siblings","extra_grammar":""}],"pron":"업따","roman":"eopsseoyo","explain":"'없다'는 명사 뒤에 붙어서 새 말을 많이 만들어요: 맛없다, 재미없다. 발음 조심! '맛없어요'는 [마덥써요]예요.","video_url":"","video_title":"","phrases":[{"ko":"없는 게 없다 (없는 것이 없다)","example":"다이소에는 없는 게 없어요.","literal":"\"there's nothing that isn't there\"","en_equiv":"close: you name it, they've got it","meaning_en":"Everything you could want is there.","nuance_ko":"가게·시장을 칭찬할 때","source":"우리말샘"},{"ko":"어이없다","example":"택시비가 오만 원이요? 진짜 어이없어요.","literal":"\"there's no 어이\" (어이 has no meaning on its own)","en_equiv":"ridiculous / unbelievable","meaning_en":"So absurd you're lost for words.","nuance_ko":"황당할 때","source":"common usage"},{"ko":"정신없다","example":"오늘 아침은 너무 정신없었어요.","literal":"\"there's no mind\"","en_equiv":"hectic / frazzled","meaning_en":"So busy or chaotic you can't think straight.","nuance_ko":"바쁘고 복잡할 때","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"우리 집에는 아직 전화가 없다.","en":"We still don't have a phone at home.","src":"우리말샘"},{"ko":"나는 지금 수중에 돈이 없다.","en":"I have no money on me right now.","src":"우리말샘"},{"ko":"차비가 없어 먼 길을 걸어왔다.","en":"I had no bus fare, so I walked the long way.","src":"우리말샘"}],"explain_en":"없다 attaches to nouns to make lots of new adjectives: 맛없다 (tasteless), 재미없다 (boring). Watch the pronunciation: 맛없어요 is said [마덥써요]."},{"id":"n00226","kind":"word","ko":"아니다","yo":"아니에요","en":"to not be","pos":"형용사","usage":"","contract":"","examples":[{"id":"e00003","ko":"여기는 학교가 아니에요.","en":"This isn't the school.","speech_level":"해요","cloze":"아니에요","extra_word":"","extra_grammar":""},{"id":"e00004","ko":"저분은 우리 선생님이 아니에요.","en":"That person isn't our teacher.","speech_level":"해요","cloze":"아니에요","extra_word":"저분 = that person (polite)","extra_grammar":""}],"pron":"아니다","roman":"anieyo","explain":"'고마워요', '미안해요'에 '아니에요'라고 대답하면 'You're welcome / It's okay'라는 뜻이에요. '아니요'(No)와 헷갈리지 마세요.","video_url":"","video_title":"","phrases":[{"ko":"아니나 다를까","example":"아니나 다를까 그 친구가 또 늦었어요.","literal":"\"is it not, is it different\"","en_equiv":"sure enough / just as expected","meaning_en":"Things turned out exactly as predicted.","nuance_ko":"예상대로 됐을 때","source":"우리말샘"},{"ko":"아닌 게 아니라","example":"아닌 게 아니라 오늘 정말 춥네요.","literal":"\"it's not that it's not\"","en_equiv":"close: indeed, now that you mention it","meaning_en":"Agreeing that something really is so.","nuance_ko":"남의 말에 맞장구칠 때","source":"우리말샘"},{"ko":"아닌 밤중에 홍두깨","example":"갑자기 이사 간다고요? 아닌 밤중에 홍두깨네요.","literal":"\"a rolling pin in the dead of night\"","en_equiv":"out of the blue","meaning_en":"Something sudden and totally unexpected.","nuance_ko":"황당하게 갑작스러울 때","source":"우리말샘"}],"pron_source":"우리말샘","dict_examples":[{"ko":"그는 군인이 아니다.","en":"He is not a soldier.","src":"우리말샘"},{"ko":"나는 청소 당번이 아니야.","en":"I'm not on cleaning duty.","src":"우리말샘"},{"ko":"그 문제의 정답은 2번이 아니고 4번이다.","en":"The answer to that question isn't 2, it's 4.","src":"우리말샘"}],"explain_en":"Answering 고마워요 or 미안해요 with 아니에요 means 'You're welcome / It's okay'. Don't mix it up with 아니요 ('No')."},{"id":"n00227","kind":"word","ko":"크다","yo":"커요","en":"to be big","pos":"형용사","usage":"","contract":"","examples":[{"id":"e00113","ko":"형은 키가 정말 커요.","en":"My older brother is really tall.","speech_level":"해요","cloze":"커요","extra_word":"","extra_grammar":""},{"id":"e00114","ko":"이 신발은 너무 커요.","en":"These shoes are too big.","speech_level":"해요","cloze":"커요","extra_word":"신발 = shoes","extra_grammar":""}],"pron":"크다","roman":"keoyo","explain":"'크다'는 '자라다(grow)'라는 뜻의 동사도 돼요. 그래서 '컸어요'는 '자랐어요'일 때가 많아요. 소리가 클 때(loud)도 '커요'라고 해요.","video_url":"","video_title":"","phrases":[{"ko":"큰일 났다","example":"큰일 났어요! 지갑이 없어요.","literal":"\"a big thing has happened\"","en_equiv":"Oh no! / I'm in big trouble","meaning_en":"something has suddenly gone badly wrong","nuance_ko":"깜짝 놀랐을 때 혼잣말로","source":"common usage"},{"ko":"큰맘 먹다","example":"큰맘 먹고 새 노트북을 샀어요.","literal":"\"to eat a big mind\"","en_equiv":"close: to take the plunge / splurge","meaning_en":"to make a bold decision, often a big purchase","nuance_ko":"비싼 걸 살 때 자주","source":"common usage"},{"ko":"손이 크다","example":"우리 엄마는 손이 커서 음식을 많이 해요.","literal":"\"hands are big\"","en_equiv":"close: generous (with portions)","meaning_en":"always makes or gives far too much, especially food","nuance_ko":"음식을 많이 할 때","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"눈이 크다.","en":"To have big eyes.","src":"우리말샘"},{"ko":"나는 큰 집에서 살고 싶다.","en":"I want to live in a big house.","src":"우리말샘"},{"ko":"글씨를 크게 적어서 뒤에서도 잘 보인다.","en":"The writing is big, so you can see it well even from the back.","src":"우리말샘"}],"explain_en":"크다 is also a verb meaning 'to grow up', so 컸어요 often means 'grew'. It is also used for loud sounds: 소리가 커요 = it's loud."},{"id":"n00232","kind":"word","ko":"반갑다","yo":"반가워요","en":"to be glad / to be happy (to see)","pos":"형용사","usage":"","contract":"","examples":[{"id":"e00005","ko":"선생님, 만나서 반가워요.","en":"Nice to meet you, teacher.","speech_level":"해요","cloze":"반가워요","extra_word":"","extra_grammar":""},{"id":"e00006","ko":"네, 저도 반가워요.","en":"Yes, nice to meet you too.","speech_level":"해요","cloze":"반가워요","extra_word":"","extra_grammar":""}],"pron":"반갑따","roman":"bangawoyo","explain":"사람을 만나서 기쁠 때는 '기뻐요'가 아니라 '반가워요'를 써요. 처음 만날 때만이 아니라 오랜만에 만나도, 기다리던 것이 와도 '반가워요'.","video_url":"","video_title":"","phrases":[{"ko":"반가운 소식","example":"반가운 소식이 있어요! 저 합격했어요.","literal":"\"glad news\"","en_equiv":"good news / welcome news","meaning_en":"News you were hoping to hear.","nuance_ko":"좋은 소식 전할 때","source":"common usage"},{"ko":"반가운 비","example":"가뭄 끝에 반가운 비가 내렸어요.","literal":"\"glad rain\"","en_equiv":"a welcome rain","meaning_en":"Rain that finally comes after a long dry spell.","nuance_ko":"뉴스·날씨에서 자주","source":"common usage"},{"ko":"이게 누구야, 반갑다!","example":"아이고, 이게 누구야! 진짜 반갑다.","literal":"\"who is this! glad!\"","en_equiv":"Look who it is!","meaning_en":"Happy surprise at running into someone after a while.","nuance_ko":"오랜만에 만난 친구에게(반말)","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"나는 그 손님이 무척 반갑다.","en":"I'm very glad to see that guest.","src":"우리말샘"},{"ko":"학우들은 나를 반갑게 맞이하였다.","en":"My classmates greeted me warmly.","src":"우리말샘"},{"ko":"타향에서 고향 사람을 만나면 참 반갑다.","en":"Meeting someone from your hometown far from home is a real joy.","src":"우리말샘"}],"explain_en":"When you're happy to see someone, Koreans say 반가워요, not 기뻐요. It's not only for first meetings — you also say it when you see someone after a long time, or when something you've been waiting for arrives."},{"id":"n00241","kind":"word","ko":"같다","yo":"같아요","en":"to be the same / to be like","pos":"형용사","usage":"","contract":"","examples":[{"id":"e00115","ko":"우리는 나이가 같아요.","en":"We're the same age.","speech_level":"해요","cloze":"같아요","extra_word":"나이 = age","extra_grammar":""},{"id":"e00116","ko":"저하고 친구는 생일이 같아요.","en":"My friend and I have the same birthday.","speech_level":"해요","cloze":"같아요","extra_word":"생일 = birthday","extra_grammar":""}],"pron":"갇따","roman":"gatayo","explain":"'-(으)ㄴ 것 같아요'는 말을 부드럽게 해요. 한국 사람은 확실한 것도 '맛있는 것 같아요'처럼 돌려 말할 때가 많아요.","video_url":"","video_title":"","phrases":[{"ko":"꿈만 같다","example":"합격이라니 꿈만 같아요.","literal":"\"it's just like a dream\"","en_equiv":"close: it feels like a dream","meaning_en":"so good it hardly feels real","nuance_ko":"믿을 수 없게 좋을 때","source":"common usage"},{"ko":"남 같지 않다","example":"처음 만났는데 남 같지 않아요.","literal":"\"not like a stranger\"","en_equiv":"close: feels like I've known you forever","meaning_en":"someone new already feels familiar, like family","nuance_ko":"금방 마음이 통할 때","source":"common usage"},{"ko":"같은 값이면 다홍치마","example":"같은 값이면 다홍치마라고, 예쁜 걸로 사요.","literal":"\"if the price is the same, the crimson skirt\"","en_equiv":"—","meaning_en":"if it costs the same, choose the nicer one","nuance_ko":"물건을 고를 때","source":"우리말샘"}],"pron_source":"우리말샘","dict_examples":[{"ko":"나는 그와 키가 같다.","en":"He and I are the same height.","src":"우리말샘"},{"ko":"우리는 같은 학교에 다닌다.","en":"We go to the same school.","src":"우리말샘"},{"ko":"나는 그와 같은 동네에 산다.","en":"He and I live in the same neighborhood.","src":"우리말샘"}],"explain_en":"'-(으)ㄴ 것 같아요' (it seems…) softens what you say. Koreans often use it even about things they are sure of, like 'it seems tasty'."},{"id":"n00245","kind":"word","ko":"친하다","yo":"친해요","en":"to be close (friends)","pos":"형용사","usage":"","contract":"","examples":[{"id":"e00117","ko":"우리는 아주 친해요.","en":"We're very close.","speech_level":"해요","cloze":"친해요","extra_word":"","extra_grammar":""},{"id":"e00118","ko":"그 친구하고 친해요?","en":"Are you close with that friend?","speech_level":"해요","cloze":"친해요","extra_word":"","extra_grammar":""}],"pron":"친하다","roman":"chinhaeyo","explain":"한국에서는 친해지면 존댓말 대신 반말을 써요. 그래서 '우리 말 편하게 할까요?'라고 물어보는 날이 와요. 보통 나이가 많은 사람이 먼저 물어봐요.","video_url":"","video_title":"","phrases":[{"ko":"앞으로 친하게 지내요","example":"만나서 반가워요. 앞으로 친하게 지내요!","literal":"\"from now on let's get along closely\"","en_equiv":"close: hope we can be friends","meaning_en":"a friendly line when meeting someone new","nuance_ko":"처음 만난 날 인사로","source":"common usage"},{"ko":"친한 척하다","example":"잘 모르는 사람이 자꾸 친한 척해요.","literal":"\"to pretend to be close\"","en_equiv":"to act all buddy-buddy","meaning_en":"to act closer to someone than you really are","nuance_ko":"좀 불편할 때, 놀릴 때","source":"common usage"},{"ko":"절친","example":"민지는 제 절친이에요.","literal":"\"extremely-close friend\"","en_equiv":"best friend / BFF","meaning_en":"your very closest friend (short for 절친한 친구)","nuance_ko":"친구끼리 편하게","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"그 둘은 무척 친하다.","en":"Those two are very close.","src":"우리말샘"},{"ko":"그는 주로 구례에서 온 고향 사람들과 친하게 어울렸다.","en":"He mostly hung out with people from his hometown, Gurye.","src":"우리말샘"}],"explain_en":"In Korea, once people become close they switch from polite speech to 반말. So there comes a day when someone asks, 'Shall we speak casually?' Usually the older person asks first."},{"id":"n00259","kind":"word","ko":"많다","yo":"많아요","en":"to be many / to be much","pos":"형용사","usage":"","contract":"","examples":[{"id":"e00085","ko":"시장에 사람이 아주 많아요.","en":"There are lots of people at the market.","speech_level":"해요","cloze":"많아요","extra_word":"시장 = market","extra_grammar":""},{"id":"e00086","ko":"우리 가족은 형제가 많아요.","en":"There are a lot of siblings in my family.","speech_level":"해요","cloze":"많아요","extra_word":"형제 = siblings","extra_grammar":""}],"pron":"만타","roman":"manayo","explain":"'많다'는 형용사라서 '사람이 많아요' 하나로 'There are many people'이 돼요. 식사 자리에서 '많이 드세요!'는 '맛있게 드세요'처럼 쓰는 따뜻한 인사예요.","video_url":"","video_title":"","phrases":[{"ko":"말이 많다","example":"제 동생은 말이 너무 많아요.","literal":"\"words are many\"","en_equiv":"talkative / chatty","meaning_en":"Talks a lot; also: there's lots of gossip about it.","nuance_ko":"흉볼 때 많이","source":"common usage"},{"ko":"정이 많다","example":"우리 할머니는 정이 정말 많아요.","literal":"\"jeong (affection) is plentiful\"","en_equiv":"warm-hearted","meaning_en":"Caring, affectionate and generous toward others.","nuance_ko":"따뜻한 사람 칭찬","source":"common usage"},{"ko":"나이가 많다","example":"저보다 나이가 많으시네요.","literal":"\"age is much\"","en_equiv":"to be older","meaning_en":"A polite way to say someone is old or older.","nuance_ko":"'늙었다'보다 공손","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"경험이 많다.","en":"To have a lot of experience.","src":"우리말샘"},{"ko":"그 많던 돈을 다 써 버렸다.","en":"I spent all that money.","src":"우리말샘"},{"ko":"손님이 많지 않은 식당에는 안 가게 된다.","en":"I end up avoiding restaurants that don't have many customers.","src":"우리말샘"}],"explain_en":"많다 is an adjective, so '사람이 많아요' alone means 'there are many people.' At meals, '많이 드세요!' (eat a lot!) is a warm way of saying 'enjoy your food.'"},{"id":"n00302","kind":"word","ko":"우리","yo":"","en":"We / Our","pos":"대명사","usage":"","contract":"","examples":[{"id":"e00087","ko":"우리 같이 가요!","en":"Let's go together!","speech_level":"해요","cloze":"우리","extra_word":"같이 = together","extra_grammar":""},{"id":"e00088","ko":"우리 아버지는 선생님이에요.","en":"My dad is a teacher.","speech_level":"해요","cloze":"우리","extra_word":"","extra_grammar":""}],"pron":"우리","roman":"uri","explain":"외동이어도 '우리 엄마', 혼자 살아도 '우리 집'이라고 해요. '내 엄마'라고 하면 어색해요. 한국어의 '우리'는 '나와 내 사람들'이라는 느낌이에요.","video_url":"https://www.youtube.com/results?search_query=우리+한국어","video_title":"'우리 엄마'의 비밀 (예시)","phrases":[{"ko":"우리끼리 얘긴데","example":"우리끼리 얘긴데, 그 가게 별로예요.","literal":"\"it's talk just among us\"","en_equiv":"between you and me","meaning_en":"Introduces a secret or frank opinion.","nuance_ko":"비밀 이야기를 꺼낼 때","source":"common usage"},{"ko":"우리 사이에 뭘 이런 걸 다","example":"아이고, 우리 사이에 뭘 이런 걸 다 사 왔어요?","literal":"\"between us, why all this stuff\"","en_equiv":"Oh, you shouldn't have!","meaning_en":"Warm, modest thanks when receiving a gift.","nuance_ko":"선물 받을 때 고마움 표현","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"우리는 꼭 다시 만나게 될 거야.","en":"We'll surely meet again.","src":"우리말샘"},{"ko":"어머니, 우리 오늘 도봉산에 갈까요?","en":"Mom, shall we go to Dobongsan today?","src":"우리말샘"},{"ko":"선생님께서 우리에게 저녁을 사 주시겠대.","en":"The teacher says he'll buy us dinner.","src":"우리말샘"}],"explain_en":"Even an only child says 우리 엄마 ('our mom'), and someone living alone says 우리 집 ('our home'). 내 엄마 ('my mom') sounds odd. Korean 우리 has the feeling of 'me and my people'."},{"id":"n00304","kind":"word","ko":"제","yo":"","en":"I","pos":"대명사","usage":"","contract":"","examples":[{"id":"e00029","ko":"여기가 제 집이에요.","en":"This is my home.","speech_level":"해요","cloze":"제","extra_word":"","extra_grammar":""},{"id":"e00030","ko":"이 사람은 제 친구예요.","en":"This is my friend.","speech_level":"해요","cloze":"제","extra_word":"","extra_grammar":""}],"pron":"제","roman":"je","explain":"'제'는 '저의'를 줄인 말이고, '저'에 '가'가 붙어도 '제가'가 돼요. 친구에게는 '내', 어른에게는 '제'를 써요. 속담에서는 '제'가 '자기(one's own)'라는 뜻일 때가 많아요.","video_url":"","video_title":"","phrases":[{"ko":"제 꾀에 제가 넘어가다","example":"동생을 속이려다가 제 꾀에 제가 넘어갔어요.","literal":"\"fall for one's own trick\"","en_equiv":"close: be hoist with one's own petard","meaning_en":"Your own trick backfires on you.","nuance_ko":"잔꾀 부리다 실패할 때","source":"우리말샘"},{"ko":"제 무덤을 파다","example":"시험 전날 게임하는 건 제 무덤을 파는 거예요.","literal":"\"dig one's own grave\"","en_equiv":"dig one's own grave","meaning_en":"Do something that will ruin yourself.","nuance_ko":"스스로 손해 볼 때","source":"우리말샘"},{"ko":"제 발로","example":"도망간 고양이가 제 발로 돌아왔어요.","literal":"\"on its own feet\"","en_equiv":"of one's own accord","meaning_en":"By one's own choice, without being forced.","nuance_ko":"스스로 왔을 때 (조금 놀라움)","source":"우리말샘"}],"pron_source":"우리말샘","dict_examples":[{"ko":"제가 그 일을 하겠습니다.","en":"I will do that work.","src":"우리말샘"},{"ko":"유리창을 깬 사람은 제가 아닙니다.","en":"I'm not the one who broke the window.","src":"우리말샘"},{"ko":"제가 잘할 수 있는 것은 이 일뿐입니다.","en":"This is the only thing I'm good at.","src":"우리말샘"}],"explain_en":"'제' is short for '저의' (my, humble), and '저' + '가' also becomes '제가'. Use '내' with friends and '제' with elders. In proverbs, '제' often means 'one's own' rather than 'my'."},{"id":"n00305","kind":"word","ko":"뭐","yo":"","en":"What","pos":"대명사","usage":"뭐 = what (spoken short form of 무엇).","contract":"","examples":[{"id":"e00055","ko":"오늘 뭐 먹어요?","en":"What are we eating today?","speech_level":"해요","cloze":"뭐","extra_word":"","extra_grammar":""},{"id":"e00056","ko":"생일에 뭐 해요?","en":"What are you doing for your birthday?","speech_level":"해요","cloze":"뭐","extra_word":"생일 = birthday","extra_grammar":""}],"pron":"뭐","roman":"mwo","explain":"'뭐'는 'what'도 되고 'something'도 돼요. '뭐 마실래요?'는 '무엇을 마실래요?'도 되고 '뭐 좀 마실래요?(something to drink?)'도 돼요. 억양으로 구분해요.","video_url":"","video_title":"","phrases":[{"ko":"뭐니 뭐니 해도","example":"뭐니 뭐니 해도 엄마 밥이 최고예요.","literal":"\"saying this and that\"","en_equiv":"when all is said and done","meaning_en":"Whatever anyone says, this is the best.","nuance_ko":"최고를 말할 때","source":"우리말샘"},{"ko":"뭐 어때요?","example":"좀 틀리면 뭐 어때요? 괜찮아요.","literal":"\"what about it?\"","en_equiv":"So what? / What's the big deal?","meaning_en":"It doesn't matter; don't worry about it.","nuance_ko":"걱정하는 사람에게 가볍게","source":"common usage"},{"ko":"뭐래","example":"\"내가 너보다 잘생겼어.\" \"뭐래!\"","literal":"\"what is (he) saying?\"","en_equiv":"close: Yeah, right. / Whatever.","meaning_en":"Brushing off what someone said as nonsense.","nuance_ko":"친한 친구끼리만 (반말)","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"쟤 이름이 뭐야?","en":"What's that kid's name?","src":"우리말샘"},{"ko":"그게 뭐가 그리 나쁜가요?","en":"What's so bad about that?","src":"우리말샘"},{"ko":"선생님께서 방금 뭐라고 말씀하셨니?","en":"What did the teacher just say?","src":"우리말샘"}],"explain_en":"'뭐' can mean both 'what' and 'something'. '뭐 마실래요?' can be 'What will you drink?' or 'Want something to drink?' — the intonation tells you which."},{"id":"n00306","kind":"word","ko":"무엇","yo":"","en":"What","pos":"대명사","usage":"무엇 = what (full form). 뭐 is the spoken short form.","contract":"무엇을 → 뭘, 무엇이 → 뭐가","examples":[{"id":"e00057","ko":"선생님, 이것은 무엇이에요?","en":"Teacher, what is this?","speech_level":"해요","cloze":"무엇","extra_word":"","extra_grammar":""},{"id":"e00058","ko":"가방 안에 무엇이 있어요?","en":"What's in the bag?","speech_level":"해요","cloze":"무엇","extra_word":"","extra_grammar":""}],"pron":"무얻","roman":"mueot","explain":"","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","dict_examples":[{"ko":"저 꽃의 이름은 무엇일까?","en":"","src":"우리말샘"},{"ko":"내게 무엇을 달라고 하였지?","en":"","src":"우리말샘"},{"ko":"무엇을 그렇게 골똘히 생각하고 있니?","en":"","src":"우리말샘"},{"ko":"그런 건 가져다가 무엇에 쓰려고 그러니?","en":"","src":"우리말샘"}],"explain_en":""},{"id":"n00308","kind":"word","ko":"저","yo":"","en":"I / Me","pos":"대명사","usage":"저 = I (polite). 나 = I (casual, with friends).","contract":"저는 → 전, 저를 → 절, 저의 → 제","examples":[{"id":"e00007","ko":"저는 선생님이 아니에요. 학생이에요.","en":"I'm not a teacher. I'm a student.","speech_level":"해요","cloze":"저","extra_word":"","extra_grammar":""},{"id":"e00008","ko":"안녕하세요, 선생님. 저는 제니예요.","en":"Hello, teacher. I'm Jenny.","speech_level":"해요","cloze":"저","extra_word":"","extra_grammar":""}],"pron":"저","roman":"jeo","explain":"어른이나 처음 보는 사람 앞에서는 '나' 대신 '저'를 써요. '저가'가 아니라 '제가', '저의 이름'보다 '제 이름'이라고 해요.","video_url":"","video_title":"","phrases":[{"ko":"저, 혹시…","example":"저, 혹시 한국 사람이에요?","literal":"\"I, by any chance…\"","en_equiv":"Um, excuse me…","meaning_en":"Soft hesitant opener before asking someone something.","nuance_ko":"말 꺼내기 전 망설일 때","source":"common usage"},{"ko":"저요, 저요!","example":"누가 읽어 볼래요? — 저요, 저요!","literal":"\"me, me!\"","en_equiv":"Me! Pick me!","meaning_en":"Eagerly volunteering, e.g. raising your hand in class.","nuance_ko":"손 들고 하고 싶을 때","source":"common usage"},{"ko":"저요?","example":"저요? 저 부르셨어요?","literal":"\"me?\"","en_equiv":"Who, me?","meaning_en":"Surprised that you are the one being called.","nuance_ko":"갑자기 불렸을 때","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"저는 가 볼게요.","en":"I'll be going now.","src":"우리말샘"},{"ko":"저에게 말씀을 해 주세요.","en":"Please tell me.","src":"우리말샘"},{"ko":"저하고 그 사람은 친구 사이예요.","en":"That person and I are friends.","src":"우리말샘"}],"explain_en":"With elders or people you've just met, use 저 instead of 나. With the subject marker it becomes 제가 (never 저가), and 'my name' is usually 제 이름 rather than 저의 이름."},{"id":"n00317","kind":"word","ko":"어느","yo":"","en":"Which / Some","pos":"관형사","usage":"","contract":"","examples":[{"id":"e00031","ko":"어느 학교 학생이에요?","en":"Which school do you go to?","speech_level":"해요","cloze":"어느","extra_word":"","extra_grammar":""},{"id":"e00032","ko":"이거하고 저거, 어느 거 좋아해요?","en":"This one or that one, which do you like?","speech_level":"해요","cloze":"어느","extra_word":"","extra_grammar":""}],"pron":"어느","roman":"eoneu","explain":"'어느'는 정해진 것들 중에서 하나를 고를 때 써요(어느 나라, 어느 쪽). 고를 것이 정해져 있지 않으면 '무슨'을 써요(무슨 음식 좋아해요?).","video_url":"","video_title":"","phrases":[{"ko":"어느 정도","example":"어느 정도는 우리가 감안해야지.","literal":"\"which degree\"","en_equiv":"to some extent / up to a point","meaning_en":"not completely, but a fair amount","nuance_ko":"완벽하진 않아도 '이만큼은 받아들이자'는 느낌","source":"선생님 요청"},{"ko":"어느 세월에","example":"이 많은 숙제를 어느 세월에 다 해요?","literal":"\"in which era\"","en_equiv":"close: It'll take forever","meaning_en":"Complaining something will take ages to finish.","nuance_ko":"끝이 안 보일 때 한숨","source":"우리말샘"},{"ko":"어느새","example":"어느새 10월도 다 갔네요.","literal":"\"which-moment\"","en_equiv":"before you knew it","meaning_en":"Time passed surprisingly fast.","nuance_ko":"시간이 빨라 놀랄 때","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"어느 동네에서 오셨어요?","en":"Which neighborhood are you from?","src":"우리말샘"},{"ko":"어느 것이 맞는 답입니까?","en":"Which one is the correct answer?","src":"우리말샘"}],"explain_en":"어느 is for picking one from a known set (which country, which side). When the options aren't set, use 무슨 instead (무슨 음식 좋아해요? 'What food do you like?')."},{"id":"n00325","kind":"word","ko":"아니요","yo":"","en":"No","pos":"감탄사","usage":"","contract":"","examples":[{"id":"e00009","ko":"아니요, 그거 제 거 아니에요.","en":"No, that's not mine.","speech_level":"해요","cloze":"아니요","extra_word":"","extra_grammar":""},{"id":"e00010","ko":"아니요, 오늘은 아니에요.","en":"No, not today.","speech_level":"해요","cloze":"아니요","extra_word":"","extra_grammar":""}],"pron":"아니요","roman":"aniyo","explain":"한국어의 '네/아니요'는 질문의 말이 맞는지에 대답해요. '안 먹어요?' — '네, 안 먹어요.' 영어와 반대라서 많이 헷갈려요.","video_url":"","video_title":"","phrases":[{"ko":"아니요, 괜찮아요","example":"더 드세요. — 아니요, 괜찮아요. 배불러요.","literal":"\"no, it's okay\"","en_equiv":"No thanks, I'm good.","meaning_en":"Politely declining an offer.","nuance_ko":"권할 때 사양","source":"common usage"},{"ko":"아니요, 아니요","example":"아니요, 아니요, 오늘은 제가 낼게요.","literal":"\"no, no\"","en_equiv":"No, no, I insist.","meaning_en":"Insisting politely, e.g. on paying.","nuance_ko":"계산할 때 서로 사양","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"“절 아시나요?” “아니요, 모릅니다.”","en":"\"Do you know me?\" \"No, I don't.\"","src":"우리말샘"},{"ko":"“우리랑 같이 갈래?” “아니요, 안 갈래요.”","en":"\"Want to come with us?\" \"No, I won't.\"","src":"우리말샘"},{"ko":"“너 숙제는 다 했니?” “아니요, 아직 덜 했어요.”","en":"\"Did you finish your homework?\" \"No, not yet.\"","src":"우리말샘"}],"explain_en":"Korean 네/아니요 answers whether the question's statement is right. 'You're not eating?' — '네 (right), I'm not eating.' It's the opposite of English, so it confuses many learners."},{"id":"n00326","kind":"word","ko":"예","yo":"","en":"Yes (polite)","pos":"감탄사","usage":"예 = yes (polite). 네 means the same and is more common.","contract":"","examples":[{"id":"e00011","ko":"학생이에요? 예, 학생이에요.","en":"Are you a student? Yes, I am.","speech_level":"해요","cloze":"예","extra_word":"","extra_grammar":""},{"id":"e00012","ko":"예, 저는 학생이 아니에요.","en":"Right, I'm not a student.","speech_level":"해요","cloze":"예","extra_word":"","extra_grammar":""}],"pron":"예","roman":"ye","explain":"'예'와 '네'는 둘 다 표준어예요. '예'가 조금 더 공손하고 딱딱해서 어른 앞이나 회사에서 많이 들려요.","video_url":"","video_title":"","phrases":[{"ko":"예?","example":"예? 다시 한번 말해 주세요.","literal":"\"yes?\" (rising tone)","en_equiv":"Pardon? / Sorry?","meaning_en":"Didn't catch that, or surprised disbelief.","nuance_ko":"끝을 올려서, 못 들었을 때","source":"common usage"},{"ko":"예, 알겠습니다","example":"예, 알겠습니다. 바로 보내 드리겠습니다.","literal":"\"yes, (I) understand\"","en_equiv":"Understood. / Will do.","meaning_en":"Polite acknowledgment of a request or instruction.","nuance_ko":"윗사람·손님에게","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"“숙제 다 했니?” “예, 다 했어요.”","en":"\"Did you finish your homework?\" \"Yes, I did.\"","src":"우리말샘"},{"ko":"“아빠 집에 계시니?” “예, 계세요.”","en":"\"Is your dad home?\" \"Yes, he is.\"","src":"우리말샘"},{"ko":"예, 제가 직접 두 눈으로 확인했습니다.","en":"Yes, I saw it with my own eyes.","src":"우리말샘"}],"explain_en":"Both 예 and 네 are standard Korean. 예 sounds a little more polite and stiff, so you hear it a lot with elders and at work."},{"id":"n00327","kind":"word","ko":"안녕","yo":"","en":"Hello / Bye","pos":"감탄사","usage":"","contract":"","examples":[{"id":"e00013","ko":"안녕, 친구야! 반가워.","en":"Hi! Good to see you.","speech_level":"반말","cloze":"안녕","extra_word":"","extra_grammar":""},{"id":"e00014","ko":"'안녕'은 친구 인사예요.","en":"'Annyeong' is a greeting for friends.","speech_level":"해요","cloze":"안녕","extra_word":"인사 = greeting","extra_grammar":""}],"pron":"안녕","roman":"annyeong","explain":"'안녕(安寧)'은 원래 '평안하다'는 뜻이에요. 그래서 '안녕하세요?'는 사실 '평안하세요?'라는 질문이에요. 헤어질 때는 남는 사람에게 '안녕히 계세요', 가는 사람에게 '안녕히 가세요'라고 해요.","video_url":"","video_title":"","phrases":[{"ko":"그간 안녕하셨습니까?","example":"선생님, 그간 안녕하셨습니까? 정말 오랜만입니다.","literal":"\"were you at peace all this while?\"","en_equiv":"close: How have you been all this time?","meaning_en":"Very formal greeting after a long time apart.","nuance_ko":"오랜만에, 아주 정중하게","source":"common usage"},{"ko":"안녕하신지요?","example":"선생님, 그동안 안녕하신지요? 저는 잘 지내고 있습니다.","literal":"\"are you at peace, I wonder?\"","en_equiv":"I hope this finds you well.","meaning_en":"Polite opening line of a letter or email.","nuance_ko":"편지·이메일 첫 줄","source":"common usage"},{"ko":"여러분의 안녕을 빕니다","example":"모든 분의 건강과 안녕을 빕니다.","literal":"\"I pray for your peace\"","en_equiv":"close: Wishing you all safety and well-being","meaning_en":"Formal wish for others' safety and well-being.","nuance_ko":"연설·방송·편지 끝인사","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"친구야, 안녕.","en":"Bye, my friend.","src":"우리말샘"},{"ko":"안녕, 또 만나자.","en":"Bye, see you again.","src":"우리말샘"},{"ko":"그럼 안녕, 내일 보자.","en":"Well, bye — see you tomorrow.","src":"우리말샘"}],"explain_en":"안녕 (安寧) originally means 'peace, being well'. So 안녕하세요? is really the question 'Are you at peace?'. When parting, you say 안녕히 계세요 ('stay well') to the person staying and 안녕히 가세요 ('go well') to the person leaving."},{"id":"n00329","kind":"word","ko":"와/과","yo":"","en":"And / With (particle)","pos":"조사","usage":"","contract":"","examples":[{"id":"e00089","ko":"아버지와 어머니는 고향에 살아요.","en":"My father and mother live in my hometown.","speech_level":"해요","cloze":"와","extra_word":"살다 = to live","extra_grammar":""},{"id":"e00090","ko":"남편과 아기가 집에 있어요.","en":"My husband and the baby are at home.","speech_level":"해요","cloze":"과","extra_word":"","extra_grammar":""}],"pron":"와","roman":"wa","explain":"","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","dict_examples":[{"ko":"개와 고양이.","en":"","src":"우리말샘"},{"ko":"오빠와 누이 관계.","en":"","src":"우리말샘"},{"ko":"우리는 자유와 평등의 실현을 위해 싸웠다.","en":"","src":"우리말샘"},{"ko":"너와 내가 아니면 우리 조국을 누가 지키랴.","en":"","src":"우리말샘"}],"explain_en":""},{"id":"n00331","kind":"word","ko":"남편","yo":"","en":"Husband","pos":"명사","usage":"","contract":"","examples":[{"id":"e00091","ko":"제 남편은 미국 사람이에요.","en":"My husband is American.","speech_level":"해요","cloze":"남편","extra_word":"","extra_grammar":""},{"id":"e00092","ko":"남편이 아기하고 놀아요.","en":"My husband is playing with the baby.","speech_level":"해요","cloze":"남편","extra_word":"놀다 = to play","extra_grammar":""}],"pron":"남편","roman":"nampyeon","explain":"결혼한 여자는 '제 남편'보다 '우리 남편'이라고 많이 해요. 결혼한 뒤에도 남편을 '오빠'라고 부르는 사람이 많아요. 다른 사람의 남편은 '남편분'이라고 높여요.","video_url":"","video_title":"","phrases":[{"ko":"남의 편","example":"남편은 남의 편이라서 남편이래요.","literal":"\"someone else's side\"","en_equiv":"—","meaning_en":"Joke: a husband sides with everyone except his wife.","nuance_ko":"아내들끼리 하는 농담","source":"common usage"},{"ko":"신랑","example":"우리 신랑이 저녁을 해 줬어요.","literal":"\"bridegroom\"","en_equiv":"close: hubby","meaning_en":"Husband, said warmly even long after the wedding.","nuance_ko":"결혼 오래돼도 친근하게","source":"common usage"},{"ko":"남편 복이 있다","example":"언니는 남편 복이 많네요.","literal":"\"to have husband luck\"","en_equiv":"close: lucky in marriage","meaning_en":"She has a good, caring husband.","nuance_ko":"남편이 좋은 사람일 때","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"남편을 잃다.","en":"To lose one's husband.","src":"우리말샘"},{"ko":"결혼기념일을 맞아 남편과 여행을 가기로 했다.","en":"I decided to take a trip with my husband for our anniversary.","src":"우리말샘"}],"explain_en":"Married women usually say 우리 남편 (our husband) rather than 제 남편. Many still call their husband 오빠 after marriage. Someone else's husband is 남편분, to be polite."},{"id":"n00335","kind":"word","ko":"형","yo":"","en":"older brother","pos":"명사","usage":"","contract":"","examples":[{"id":"e00119","ko":"형, 지금 어디예요?","en":"Hey (big brother), where are you now?","speech_level":"해요","cloze":"형","extra_word":"","extra_grammar":""},{"id":"e00120","ko":"우리 형은 서울에 살아요.","en":"My older brother lives in Seoul.","speech_level":"해요","cloze":"형","extra_word":"살다 = to live","extra_grammar":""}],"pron":"형","roman":"hyeong","explain":"남자가 손위 남자 형제를 부를 때 써요. 여자는 '오빠'라고 해요. 가족이 아니어도 친한 손위 남자는 '형'이라고 불러요.","video_url":"","video_title":"","phrases":[{"ko":"형만 한 아우 없다","example":"속편도 재밌었지만 역시 형만 한 아우 없네요.","literal":"\"no younger brother is as good as the older\"","en_equiv":"close: the sequel's never as good as the original","meaning_en":"The younger one (or a sequel) never beats the original.","nuance_ko":"속편 영화 평가에도","source":"우리말샘"},{"ko":"형 동생 하는 사이","example":"그 선배하고는 형 동생 하는 사이예요.","literal":"\"a 'big bro, little bro' relationship\"","en_equiv":"close: tight as brothers","meaning_en":"Not related, but as close as brothers.","nuance_ko":"남자끼리 아주 친할 때","source":"common usage"},{"ko":"형님 먼저 아우 먼저","example":"형님 먼저 아우 먼저, 서로 양보해요.","literal":"\"older brother first, younger brother first\"","en_equiv":"close: \"after you\" — \"no, after you\"","meaning_en":"Politely offering each other the first turn.","nuance_ko":"서로 양보할 때","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"나와 형은 눈이 아버지를 쏙 빼닮았다.","en":"My brother and I both have our father's eyes.","src":"우리말샘"}],"explain_en":"Males use 형 for an older brother; females say 오빠 instead. Guys also call any close, older male friend 형, family or not."},{"id":"n00337","kind":"word","ko":"누나","yo":"","en":"Older sister (for male)","pos":"명사","usage":"","contract":"","examples":[{"id":"e00121","ko":"우리 누나는 선생님이에요.","en":"My older sister is a teacher.","speech_level":"해요","cloze":"누나","extra_word":"","extra_grammar":""},{"id":"e00122","ko":"누나, 지금 집에 있어요?","en":"Sis, are you home now?","speech_level":"해요","cloze":"누나","extra_word":"","extra_grammar":""}],"pron":"누나","roman":"nuna","explain":"남자가 손위 여자 형제를 부를 때 써요. 여자는 '언니'라고 해요. 가족이 아니어도 친한 손위 여자에게 '누나'라고 불러요.","video_url":"","video_title":"","phrases":[{"ko":"누나라고 불러","example":"나이 차이 별로 안 나니까 누나라고 불러.","literal":"\"call (me) 누나\"","en_equiv":"—","meaning_en":"An older woman inviting a younger man to drop formalities.","nuance_ko":"친해지자는 말","source":"common usage"},{"ko":"누님","example":"누님, 오랜만입니다!","literal":"\"honored older sister\"","en_equiv":"—","meaning_en":"A respectful or playful way for men to address an older woman.","nuance_ko":"높이거나 장난스럽게","source":"common usage"},{"ko":"누나 팬","example":"그 아이돌은 누나 팬이 많아요.","literal":"\"older-sister fans\"","en_equiv":"—","meaning_en":"Female fans who are older than the male star.","nuance_ko":"연예 기사에서 자주","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"누나는 나보다 세 살이 많다.","en":"My older sister is three years older than me.","src":"우리말샘"}],"explain_en":"Males use 누나 for an older sister; females say 언니 instead. Guys also call a close, older female friend 누나, family or not."},{"id":"n00343","kind":"word","ko":"가족","yo":"","en":"Family","pos":"명사","usage":"","contract":"","examples":[{"id":"e00093","ko":"가족이 다 서울에 살아요.","en":"My whole family lives in Seoul.","speech_level":"해요","cloze":"가족","extra_word":"살다 = to live","extra_grammar":""},{"id":"e00094","ko":"이거 우리 가족 사진이에요.","en":"This is a photo of my family.","speech_level":"해요","cloze":"가족","extra_word":"사진 = photo","extra_grammar":""}],"pron":"가족","roman":"gajok","explain":"'식구'라는 말도 많이 써요. 한자로 '먹을 식(食) + 입 구(口)', 같이 밥 먹는 사람이라는 뜻이에요. 그래서 같이 사는 사람이나 같은 회사 사람도 '한 식구'라고 해요.","video_url":"","video_title":"","phrases":[{"ko":"가족 같은 회사","example":"면접에서 '가족 같은 회사'라고 해서 좀 걱정돼요.","literal":"\"a company like a family\"","en_equiv":"close: \"we're like a family here\" (job-ad red flag)","meaning_en":"Joke: expect long hours and no work-life boundaries.","nuance_ko":"직장인들의 농담","source":"common usage"},{"ko":"피는 물보다 진하다","example":"싸워도 결국 형을 도왔어요. 피는 물보다 진하네요.","literal":"\"blood is thicker than water\"","en_equiv":"blood is thicker than water","meaning_en":"Family ties are stronger than other relationships.","nuance_ko":"결국 가족 편을 들 때","source":"common usage"},{"ko":"가화만사성","example":"할머니 집 벽에 '가화만사성'이 걸려 있어요.","literal":"\"home harmonious, ten thousand things succeed\"","en_equiv":"—","meaning_en":"When the family is at peace, everything goes well.","nuance_ko":"집에 거는 글귀, 덕담","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"가족을 부양하다.","en":"To support one's family.","src":"우리말샘"},{"ko":"잃어버렸던 아이가 열흘 만에 가족 품으로 돌아왔다.","en":"The lost child came back to his family after ten days.","src":"우리말샘"},{"ko":"전시회에 가족 단위의 관람객들이 줄을 잇고 있다.","en":"Families are lining up to see the exhibition.","src":"우리말샘"}],"explain_en":"Koreans also say 식구, written with the characters for 'eat' and 'mouth': the people you share meals with. That's why people who live together, or even coworkers, can be called 한 식구 (one family)."},{"id":"n00344","kind":"word","ko":"아버지","yo":"","en":"Father","pos":"명사","usage":"","contract":"","examples":[{"id":"e00095","ko":"아버지는 지금 회사에 있어요.","en":"My father is at work now.","speech_level":"해요","cloze":"아버지","extra_word":"회사 = company, office","extra_grammar":""},{"id":"e00096","ko":"아버지는 요리를 정말 잘해요.","en":"My father is a really good cook.","speech_level":"해요","cloze":"아버지","extra_word":"요리 = cooking","extra_grammar":""}],"pron":"아버지","roman":"abeoji","explain":"어릴 때는 '아빠', 어른이 되면 '아버지'라고 많이 불러요. 다른 사람의 아버지나 결혼한 사람의 시아버지·장인어른은 '아버님'이라고 높여요.","video_url":"","video_title":"","phrases":[{"ko":"붕어빵","example":"아빠랑 완전 붕어빵이네요!","literal":"\"fish-shaped bread\" (all from the same mould)","en_equiv":"the spitting image / a chip off the old block","meaning_en":"A child who looks exactly like a parent.","nuance_ko":"부모를 꼭 닮은 아이에게","source":"common usage"},{"ko":"딸바보","example":"우리 아빠는 완전 딸바보예요.","literal":"\"daughter fool\"","en_equiv":"close: a doting dad","meaning_en":"A father who adores his daughter.","nuance_ko":"다정한 아빠를 말할 때","source":"common usage"},{"ko":"아빠 찬스","example":"그 사람은 아빠 찬스로 회사에 들어갔대요.","literal":"\"dad chance\"","en_equiv":"close: riding on dad's coattails","meaning_en":"Using a parent's money or connections to get ahead.","nuance_ko":"보통 비판할 때","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"아버지를 찾다.","en":"To look for one's father.","src":"우리말샘"},{"ko":"아버지의 얼굴을 떠올리다.","en":"To picture one's father's face.","src":"우리말샘"}],"explain_en":"Kids say 아빠; as adults many people switch to 아버지. Someone else's father, and your spouse's father, is called 아버님 to show respect."},{"id":"n00347","kind":"word","ko":"동생","yo":"","en":"brother / sister","pos":"명사","usage":"","contract":"","examples":[{"id":"e00123","ko":"동생이 몇 살이에요?","en":"How old is your younger sibling?","speech_level":"해요","cloze":"동생","extra_word":"","extra_grammar":""},{"id":"e00124","ko":"동생은 지금 학교에 있어요.","en":"My younger sibling is at school now.","speech_level":"해요","cloze":"동생","extra_word":"","extra_grammar":""}],"pron":"동생","roman":"dongsaeng","explain":"동생은 남동생도 여동생도 돼요. 형이나 언니는 동생을 '동생'이라고 부르지 않고 이름을 불러요. 동생은 형, 누나, 오빠, 언니라고 불러요.","video_url":"","video_title":"","phrases":[{"ko":"아는 동생","example":"어제 아는 동생하고 밥 먹었어요.","literal":"\"a known younger sibling\"","en_equiv":"close: a younger friend","meaning_en":"a younger person you're close to, not family","nuance_ko":"가족 아닌 친한 어린 사람","source":"common usage"},{"ko":"친동생 같다","example":"저한테 민수는 친동생 같아요.","literal":"\"like a real younger sibling\"","en_equiv":"like a little brother/sister to me","meaning_en":"I care about them like real family","nuance_ko":"아끼는 어린 사람에게","source":"common usage"},{"ko":"동생을 보다","example":"우리 아들이 이번에 동생을 봤어요.","literal":"\"to see a younger sibling\"","en_equiv":"close: to become a big brother/sister","meaning_en":"to get a new baby brother or sister","nuance_ko":"아기가 태어났을 때","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"사촌 동생.","en":"A younger cousin.","src":"우리말샘"},{"ko":"저기 파란 옷을 입고 있는 아이가 내 동생이다.","en":"The child over there in blue is my younger sibling.","src":"우리말샘"}],"explain_en":"동생 means a younger brother or a younger sister. Older siblings don't call the younger one '동생' — they use their name. The younger one calls them 형, 누나, 오빠 or 언니."},{"id":"n00351","kind":"word","ko":"아기","yo":"","en":"Baby","pos":"명사","usage":"아기 = baby. 아이 = child.","contract":"","examples":[{"id":"e00097","ko":"아기가 또 울어요.","en":"The baby is crying again.","speech_level":"해요","cloze":"아기","extra_word":"울다 = to cry","extra_grammar":""},{"id":"e00098","ko":"아기가 지금 자요.","en":"The baby is sleeping now.","speech_level":"해요","cloze":"아기","extra_word":"자다 = to sleep","extra_grammar":""}],"pron":"아기","roman":"agi","explain":"말할 때는 '애기'라고 많이 해요(표준어는 '아기'). 그래서 연인이나 귀여운 사람을 '애기야'라고 부르기도 해요.","video_url":"","video_title":"","phrases":[{"ko":"아기 피부","example":"언니는 피부가 아기 피부 같아요.","literal":"\"baby skin\"","en_equiv":"baby-soft skin","meaning_en":"Very smooth, soft skin.","nuance_ko":"피부 칭찬, 화장품 광고","source":"common usage"},{"ko":"애기 입맛","example":"매운 거 못 먹어요? 완전 애기 입맛이네요.","literal":"\"baby taste buds\"","en_equiv":"close: a kid's palate","meaning_en":"Only liking sweet, mild food, nothing spicy.","nuance_ko":"친구끼리 놀릴 때","source":"common usage"},{"ko":"아기 다루듯","example":"새 노트북을 아기 다루듯 조심히 써요.","literal":"\"as if handling a baby\"","en_equiv":"close: handle with kid gloves","meaning_en":"Treating something very gently and carefully.","nuance_ko":"아주 조심할 때","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"아기를 돌보다.","en":"To look after a baby.","src":"우리말샘"},{"ko":"아기가 아장아장 걷는다.","en":"The baby toddles along.","src":"우리말샘"},{"ko":"아기에게 젖을 먹이다.","en":"To breastfeed a baby.","src":"우리말샘"}],"explain_en":"In speech people often say 애기 (the standard spelling is 아기). Couples and friends also call someone cute '애기야' (baby)."},{"id":"n00352","kind":"word","ko":"회사원","yo":"","en":"Office worker","pos":"명사","usage":"","contract":"","examples":[{"id":"e00015","ko":"제 남편은 회사원이에요.","en":"My husband is an office worker.","speech_level":"해요","cloze":"회사원","extra_word":"남편 = husband","extra_grammar":""},{"id":"e00016","ko":"저는 학생이 아니에요. 회사원이에요.","en":"I'm not a student. I'm an office worker.","speech_level":"해요","cloze":"회사원","extra_word":"","extra_grammar":""}],"pron":"회사원","roman":"hoesawon","explain":"직업을 물으면 '회사원이에요'보다 '회사 다녀요'라고 더 많이 말해요.","video_url":"","video_title":"","phrases":[{"ko":"직장인","example":"직장인은 월요일이 제일 힘들어요.","literal":"\"workplace person\"","en_equiv":"close: working people / nine-to-fivers","meaning_en":"Anyone with a regular job; used more than 회사원.","nuance_ko":"'회사원'보다 자주 쓰는 말","source":"common usage"},{"ko":"월급쟁이","example":"저야 뭐 평범한 월급쟁이죠.","literal":"\"monthly-salary guy\"","en_equiv":"close: a salaryman / just a wage earner","meaning_en":"Self-deprecating word for a salaried employee.","nuance_ko":"자기를 낮추거나 농담할 때","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"그는 자동차 회사에 다니는 회사원이다.","en":"He's an office worker at a car company.","src":"우리말샘"},{"ko":"출근 시간의 지하철은 직장으로 향하는 회사원으로 늘 만원이다.","en":"The rush-hour subway is always packed with office workers.","src":"우리말샘"}],"explain_en":"When asked about their job, Koreans more often say 회사 다녀요 ('I go to a company') than 회사원이에요."},{"id":"n00354","kind":"word","ko":"사랑","yo":"","en":"Love","pos":"명사","usage":"","contract":"","examples":[{"id":"e00099","ko":"할머니 사랑을 많이 받아요.","en":"I get a lot of love from my grandmother.","speech_level":"해요","cloze":"사랑","extra_word":"받다 = to receive","extra_grammar":""},{"id":"e00100","ko":"어머니, 정말 사랑해요.","en":"Mom, I really love you.","speech_level":"해요","cloze":"사랑","extra_word":"","extra_grammar":""}],"pron":"사랑","roman":"sarang","explain":"영어 'I love pizza'는 한국어로 '피자 정말 좋아해요'예요. '사랑해요'는 보통 사람(가족, 애인)에게만 써요.","video_url":"","video_title":"","phrases":[{"ko":"사랑은 내리사랑","example":"부모는 자식을 더 사랑해요. 사랑은 내리사랑이에요.","literal":"\"love is downward love\"","en_equiv":"—","meaning_en":"Parents love children more than children love parents.","nuance_ko":"부모·조부모 마음 말할 때","source":"우리말샘"},{"ko":"사랑꾼","example":"우리 형은 소문난 사랑꾼이에요.","literal":"\"love person\"","en_equiv":"close: a devoted partner","meaning_en":"Someone openly, sweetly devoted to their partner.","nuance_ko":"애인·배우자에게 잘할 때","source":"common usage"},{"ko":"사랑합니다, 고객님","example":"전화하자마자 '사랑합니다, 고객님!'이 나왔어요.","literal":"\"I love you, dear customer\"","en_equiv":"—","meaning_en":"Famous over-polite call-center greeting, now used as a joke.","nuance_ko":"콜센터 인사, 농담으로","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"어머니의 사랑.","en":"A mother's love.","src":"우리말샘"},{"ko":"형제간의 사랑.","en":"Love between brothers and sisters.","src":"우리말샘"},{"ko":"아랫사람을 사랑으로 대하다.","en":"To treat those below you with love.","src":"우리말샘"}],"explain_en":"'I love pizza' in Korean is '피자 정말 좋아해요.' 사랑해요 is normally kept for people: family and partners."},{"id":"n00356","kind":"word","ko":"할머니","yo":"","en":"Grandmother","pos":"명사","usage":"","contract":"","examples":[{"id":"e00101","ko":"주말에 할머니 집에 가요.","en":"I go to my grandmother's house on weekends.","speech_level":"해요","cloze":"할머니","extra_word":"주말 = weekend","extra_grammar":""},{"id":"e00102","ko":"우리 할머니는 여든 살이에요.","en":"My grandmother is eighty.","speech_level":"해요","cloze":"할머니","extra_word":"여든 = eighty","extra_grammar":""}],"pron":"할머니","roman":"halmeoni","explain":"할머니 집은 높여서 '할머니 댁'이라고 해요. 가족이 아니어도 나이 많은 여자 어른을 '할머니'라고 불러요. 하지만 젊어 보이는 분께 '할머니'는 실례예요.","video_url":"","video_title":"","phrases":[{"ko":"할머니 손맛","example":"이 김치에서 할머니 손맛이 나요.","literal":"\"grandma's hand-taste\"","en_equiv":"close: just like grandma used to make","meaning_en":"Homemade food with a warm, traditional flavor.","nuance_ko":"정성 있는 집밥 칭찬","source":"common usage"},{"ko":"할매 입맛 (할머니 입맛)","example":"떡을 이렇게 좋아해요? 완전 할매 입맛이네요!","literal":"\"granny taste buds\"","en_equiv":"—","meaning_en":"A young person who loves old-fashioned foods like rice cakes.","nuance_ko":"친구끼리 장난으로","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"할머니는 혼자서 우리 아버지를 키우셨다.","en":"Grandma raised my father on her own.","src":"우리말샘"},{"ko":"그러면 지금 아버지는 할머니께 얼마씩 드리고 계세요?","en":"So how much does Dad give Grandma now?","src":"우리말샘"}],"explain_en":"Grandma's house is said politely as 할머니 댁. You can call any elderly woman 할머니, even a stranger, but calling someone who looks younger 할머니 is rude."},{"id":"n00357","kind":"word","ko":"이름","yo":"","en":"Name","pos":"명사","usage":"","contract":"","examples":[{"id":"e00017","ko":"친구 이름이 뭐예요?","en":"What's your friend's name?","speech_level":"해요","cloze":"이름","extra_word":"","extra_grammar":""},{"id":"e00018","ko":"이건 제 이름이 아니에요.","en":"This isn't my name.","speech_level":"해요","cloze":"이름","extra_word":"","extra_grammar":""}],"pron":"이름","roman":"ireum","explain":"어른에게는 '이름' 대신 '성함'을 써요: '성함이 어떻게 되세요?' 그리고 한국어는 성(김, 이, 박)이 먼저, 이름이 뒤예요. 이름만 부르는 건 친한 사이에서만 해요.","video_url":"","video_title":"","phrases":[{"ko":"이름값을 하다","example":"역시 유명한 식당이라 이름값을 하네요.","literal":"\"to pay the name's price\"","en_equiv":"to live up to one's name","meaning_en":"To be as good as its reputation.","nuance_ko":"기대만큼 좋을 때 칭찬","source":"common usage"},{"ko":"이름도 성도 모르다","example":"이름도 성도 모르는 사람이 돈을 빌려 달래요.","literal":"\"not know the name or the surname\"","en_equiv":"not know someone from Adam","meaning_en":"To have no idea at all who someone is.","nuance_ko":"전혀 모르는 사람 강조","source":"우리말샘"},{"ko":"이름뿐인 사장","example":"그분은 이름뿐인 사장이에요. 일은 부인이 다 해요.","literal":"\"a boss who is only a name\"","en_equiv":"a boss in name only / a figurehead","meaning_en":"Has the title but no real power.","nuance_ko":"실제 힘이 없을 때","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"이름을 짓다.","en":"To give (someone) a name.","src":"우리말샘"},{"ko":"이름을 부르다.","en":"To call someone's name.","src":"우리말샘"},{"ko":"성과 이름을 적어 주세요.","en":"Please write your family name and given name.","src":"우리말샘"}],"explain_en":"For elders, use the honorific 성함 instead of 이름: 성함이 어떻게 되세요? ('May I ask your name?'). Korean names put the family name (Kim, Lee, Park) first. Calling someone by given name alone is only for close relationships."},{"id":"n00359","kind":"word","ko":"사람","yo":"","en":"Person","pos":"명사","usage":"","contract":"","examples":[{"id":"e00033","ko":"저 사람은 누구예요?","en":"Who is that person?","speech_level":"해요","cloze":"사람","extra_word":"","extra_grammar":""},{"id":"e00034","ko":"오늘 사람이 정말 많아요.","en":"There are so many people today.","speech_level":"해요","cloze":"사람","extra_word":"많다 = to be many","extra_grammar":""}],"pron":"사람","roman":"saram","explain":"눈앞에 있는 어른을 '저 사람'이라고 하면 실례예요. 어른이나 손님은 '저분', '이분'이라고 해요.","video_url":"","video_title":"","phrases":[{"ko":"사람 살려!","example":"물에 빠졌어요! 사람 살려!","literal":"\"save a person!\"","en_equiv":"Help!","meaning_en":"A cry for help in real danger; also said jokingly.","nuance_ko":"급할 때 외치는 말, 장난으로도","source":"우리말샘"},{"ko":"사람(이) 되다","example":"우리 아들, 군대 다녀오더니 사람 됐네요.","literal":"\"become a person\"","en_equiv":"close: to grow up / turn over a new leaf","meaning_en":"To finally become a mature, decent person.","nuance_ko":"철든 사람을 칭찬하거나 놀릴 때","source":"우리말샘"},{"ko":"사람 나고 돈 났지 돈 나고 사람 났나","example":"돈보다 사람이 먼저예요. 사람 나고 돈 났지, 돈 나고 사람 났나요?","literal":"\"people came first, then money; did money come first, then people?\"","en_equiv":"close: people matter more than money","meaning_en":"People are more important than money.","nuance_ko":"돈만 아는 사람에게 하는 속담","source":"우리말샘"}],"pron_source":"우리말샘","dict_examples":[{"ko":"사람으로서 지켜야 할 도리.","en":"The duty one must keep as a human being.","src":"우리말샘"},{"ko":"사람은 만물의 영장이다.","en":"Humans are the lords of all creation.","src":"우리말샘"},{"ko":"저처럼 유행과 거리가 먼 사람도 그 옷만은 한사코 구해 입었으니까요.","en":"Even someone as far from trends as me went out of my way to get that outfit.","src":"우리말샘"}],"explain_en":"Calling an older person who is right there '저 사람' sounds rude. For elders or guests, Koreans say '저분' / '이분' (that/this honored person) instead."},{"id":"n00361","kind":"word","ko":"선생님","yo":"","en":"Teacher","pos":"명사","usage":"","contract":"","examples":[{"id":"e00019","ko":"저분이 우리 선생님이에요.","en":"That's our teacher.","speech_level":"해요","cloze":"선생님","extra_word":"저분 = that person (polite)","extra_grammar":""},{"id":"e00020","ko":"선생님, 이거 뭐예요?","en":"Teacher, what is this?","speech_level":"해요","cloze":"선생님","extra_word":"","extra_grammar":""}],"pron":"선생님","roman":"seonsaengnim","explain":"학교 선생님만이 아니라 의사, 작가, 그리고 이름을 모르는 어른도 '선생님'이라고 불러요. 한국어는 사람에게 '당신'을 잘 쓰지 않아서, 이름 대신 '선생님'을 써요.","video_url":"https://www.youtube.com/results?search_query=선생님+한국어","video_title":"왜 '선생님'에는 '님'이 붙을까? (예시)","phrases":[{"ko":"선생님, 여기서 이러시면 안 돼요","example":"선생님, 여기서 담배 피우시면 안 돼요.","literal":"\"teacher, if you do this here, it's not okay\"","en_equiv":"Sir / Ma'am, you can't do that here","meaning_en":"Polite way to address and stop an unknown adult.","nuance_ko":"모르는 어른을 정중하게 부를 때","source":"common usage"},{"ko":"김 선생님 계세요?","example":"김 선생님 오늘 진료하세요? 예약했는데요.","literal":"\"is teacher Kim here?\"","en_equiv":"Is Dr. Kim in?","meaning_en":"Asking for a doctor by surname plus 선생님.","nuance_ko":"병원에서 의사를 부를 때","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"국어 선생님.","en":"A Korean-language teacher.","src":"우리말샘"},{"ko":"중학교 선생님.","en":"A middle-school teacher.","src":"우리말샘"},{"ko":"그는 진학 문제로 선생님과 상담하였다.","en":"He talked with his teacher about going on to the next school.","src":"우리말샘"}],"explain_en":"It's not only for schoolteachers: Koreans also call doctors, writers, and any older adult whose name they don't know '선생님'. Korean rarely uses 'you' (당신) to someone's face, so '선생님' fills that gap."},{"id":"n00363","kind":"word","ko":"학생","yo":"","en":"Student","pos":"명사","usage":"","contract":"","examples":[{"id":"e00021","ko":"우리는 다 학생이에요.","en":"We're all students.","speech_level":"해요","cloze":"학생","extra_word":"","extra_grammar":""},{"id":"e00022","ko":"제 친구는 학생이 아니에요.","en":"My friend isn't a student.","speech_level":"해요","cloze":"학생","extra_word":"","extra_grammar":""}],"pron":"학쌩","roman":"haksaeng","explain":"가게나 버스에서 이름을 모르는 젊은 사람을 '학생!' 하고 불러요. 진짜 학생이 아니어도요.","video_url":"","video_title":"","phrases":[{"ko":"학생 때","example":"여기는 학생 때 자주 가던 식당이에요.","literal":"\"at student time\"","en_equiv":"back in my school days","meaning_en":"When I was a student, looking back.","nuance_ko":"지난 시절 이야기할 때","source":"common usage"},{"ko":"학생인 줄 알았어요","example":"서른이세요? 학생인 줄 알았어요!","literal":"\"I thought you were a student\"","en_equiv":"close: You look so young!","meaning_en":"Compliment: you look much younger than you are.","nuance_ko":"어려 보인다는 칭찬","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"모범 학생.","en":"A model student.","src":"우리말샘"},{"ko":"3학년 학생.","en":"A third-year student.","src":"우리말샘"},{"ko":"학생 시절.","en":"One's student days.","src":"우리말샘"}],"explain_en":"In shops or on the bus, people call out '학생!' to any young person whose name they don't know — even if they aren't actually a student."},{"id":"n00364","kind":"word","ko":"여동생","yo":"","en":"Younger sister","pos":"명사","usage":"","contract":"","examples":[{"id":"e00125","ko":"제 여동생은 학생이에요.","en":"My younger sister is a student.","speech_level":"해요","cloze":"여동생","extra_word":"","extra_grammar":""},{"id":"e00126","ko":"여동생은 지금 미국에 살아요.","en":"My younger sister lives in the US now.","speech_level":"해요","cloze":"여동생","extra_word":"살다 = to live","extra_grammar":""}],"pron":"여동생","roman":"yeodongsaeng","explain":"","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","dict_examples":[{"ko":"그는 밑으로 여동생이 둘 있다.","en":"","src":"우리말샘"}],"explain_en":""},{"id":"n00368","kind":"word","ko":"미국","yo":"","en":"USA","pos":"명사","usage":"","contract":"","examples":[{"id":"e00035","ko":"제 친구는 지금 미국에 살아요.","en":"My friend lives in the US now.","speech_level":"해요","cloze":"미국","extra_word":"살다 = to live","extra_grammar":""},{"id":"e00036","ko":"지금 미국은 밤이에요.","en":"It's night in the US right now.","speech_level":"해요","cloze":"미국","extra_word":"밤 = night","extra_grammar":""}],"pron":"미국","roman":"miguk","explain":"","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","dict_examples":[],"explain_en":""},{"id":"n00370","kind":"word","ko":"외국인","yo":"","en":"Foreigner","pos":"명사","usage":"","contract":"","examples":[{"id":"e00037","ko":"우리 학교에는 외국인 학생이 많아요.","en":"There are a lot of foreign students at our school.","speech_level":"해요","cloze":"외국인","extra_word":"많다 = to be many, a lot","extra_grammar":""},{"id":"e00038","ko":"저는 외국인이에요. 한국 사람이 아니에요.","en":"I'm a foreigner. I'm not Korean.","speech_level":"해요","cloze":"외국인","extra_word":"","extra_grammar":""}],"pron":"외구긴","roman":"oegungnin","explain":"말할 때는 '외국 사람', 정중하게는 '외국 분'이라고 많이 해요. 재미있게도 한국 사람은 외국 여행 중에도 그 나라 사람들을 '외국인'이라고 불러요.","video_url":"","video_title":"","phrases":[{"ko":"외국인 등록증","example":"외국인 등록증 좀 보여 주세요.","literal":"\"foreigner registration card\"","en_equiv":"residence card (ARC)","meaning_en":"The Korean ID card for foreign residents.","nuance_ko":"은행·병원·휴대폰 개통 때","source":"common usage"},{"ko":"외국인 맞아요?","example":"발음이 너무 좋아요. 외국인 맞아요?","literal":"\"are you really a foreigner?\"","en_equiv":"close: Are you sure you're not Korean?","meaning_en":"Joking praise for someone's very good Korean.","nuance_ko":"한국어 잘하는 외국인 칭찬","source":"common usage"},{"ko":"검은 머리 외국인","example":"그 친구는 미국에서 자라서 검은 머리 외국인이에요.","literal":"\"black-haired foreigner\"","en_equiv":"—","meaning_en":"A Korean raised abroad who seems foreign.","nuance_ko":"친구끼리 농담으로","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"외국인 선교사.","en":"A foreign missionary.","src":"우리말샘"},{"ko":"오는 11월 초부터 미국에 입국하는 외국인은 코로나19 백신 접종을 완료하고 진단 검사에서도 음성 판정을 받아야 한다.","en":"From early November, foreigners entering the US must be fully vaccinated against COVID-19 and test negative.","src":"우리말샘"}],"explain_en":"In conversation Koreans usually say '외국 사람', or politely '외국 분'. Funnily enough, Koreans traveling abroad still call the locals '외국인' (foreigners)."},{"id":"n00373","kind":"word","ko":"한국","yo":"","en":"Korea","pos":"명사","usage":"","contract":"","examples":[{"id":"e00039","ko":"저는 한국 친구가 많아요.","en":"I have a lot of Korean friends.","speech_level":"해요","cloze":"한국","extra_word":"많다 = to be many, a lot","extra_grammar":""},{"id":"e00040","ko":"저는 지금 한국에 살아요.","en":"I live in Korea now.","speech_level":"해요","cloze":"한국","extra_word":"살다 = to live","extra_grammar":""}],"pron":"한국","roman":"hanguk","explain":"한국 사람들은 자기 나라를 말할 때 '한국'보다 '우리나라'를 많이 써요. 학교 과목 이름도 '한국어'가 아니라 '국어'예요.","video_url":"","video_title":"","phrases":[{"ko":"한국 사람 다 됐네요","example":"김치를 이렇게 잘 먹어요? 한국 사람 다 됐네요!","literal":"\"you've completely become a Korean person\"","en_equiv":"close: you've gone native","meaning_en":"Praise when a foreigner acts very Korean.","nuance_ko":"외국인을 칭찬할 때","source":"common usage"},{"ko":"한국인은 밥심","example":"아침 꼭 먹어요. 한국인은 밥심이에요!","literal":"\"Koreans (run on) rice power\"","en_equiv":"—","meaning_en":"Koreans need a real rice meal to have energy.","nuance_ko":"밥 먹으라고 권할 때","source":"common usage"}],"pron_source":"wiktionary","dict_examples":[],"explain_en":"When Koreans talk about their own country, they often say '우리나라' (our country) rather than '한국'. Even the school subject is called '국어' (the national language), not '한국어'."},{"id":"n00376","kind":"word","ko":"중국","yo":"","en":"China","pos":"명사","usage":"","contract":"","examples":[{"id":"e00041","ko":"제 어머니는 중국 사람이에요.","en":"My mother is Chinese.","speech_level":"해요","cloze":"중국","extra_word":"","extra_grammar":""},{"id":"e00042","ko":"저는 중국 음식을 정말 좋아해요.","en":"I really love Chinese food.","speech_level":"해요","cloze":"중국","extra_word":"음식 = food","extra_grammar":""}],"pron":"중국","roman":"jungguk","explain":"","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","dict_examples":[],"explain_en":""},{"id":"n00378","kind":"word","ko":"국적","yo":"","en":"Nationality","pos":"명사","usage":"","contract":"","examples":[{"id":"e00043","ko":"제 국적은 미국이에요.","en":"My nationality is American.","speech_level":"해요","cloze":"국적","extra_word":"","extra_grammar":""},{"id":"e00044","ko":"외국인이에요? 국적이 어디예요?","en":"Are you a foreigner? What's your nationality?","speech_level":"해요","cloze":"국적","extra_word":"","extra_grammar":""}],"pron":"국쩍","roman":"gukjeok","explain":"","video_url":"","video_title":"","phrases":[],"pron_source":"우리말샘","dict_examples":[{"ko":"대한민국 국적을 취득하다.","en":"","src":"우리말샘"}],"explain_en":""},{"id":"n00381","kind":"word","ko":"나라","yo":"","en":"Country / Nation","pos":"명사","usage":"","contract":"","examples":[{"id":"e00045","ko":"우리나라는 살기 좋아요.","en":"My country is a good place to live.","speech_level":"해요","cloze":"나라","extra_word":"","extra_grammar":"-기 좋다 = good for V-ing"},{"id":"e00046","ko":"저는 여러 나라 친구가 있어요.","en":"I have friends from many countries.","speech_level":"해요","cloze":"나라","extra_word":"여러 = various, many","extra_grammar":""}],"pron":"나라","roman":"nara","explain":"한국 사람은 자기 나라를 '한국'보다 '우리나라'라고 많이 해요. 어른 앞에서도 '저희 나라'가 아니라 '우리나라'예요. 나라는 낮추지 않아요.","video_url":"","video_title":"","phrases":[{"ko":"꿈나라","example":"아기가 벌써 꿈나라에 갔어요.","literal":"\"dream country\"","en_equiv":"dreamland / the land of Nod","meaning_en":"A cute way to say someone fell asleep.","nuance_ko":"'잠들었다'를 귀엽게","source":"common usage"},{"ko":"딴 나라 얘기","example":"해외여행? 저한테는 딴 나라 얘기예요.","literal":"\"another country's story\"","en_equiv":"close: a whole other world (for me)","meaning_en":"Something totally unrelated to my life.","nuance_ko":"나와 상관없다는 뜻","source":"common usage"},{"ko":"전생에 나라를 구했나 봐요","example":"이런 남편을 만나다니, 전생에 나라를 구했나 봐요.","literal":"\"must have saved the country in a past life\"","en_equiv":"—","meaning_en":"Joke: you must be incredibly lucky to have this.","nuance_ko":"큰 행운을 농담으로","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"나라를 잃다.","en":"To lose one's country.","src":"우리말샘"},{"ko":"나라를 세우다.","en":"To found a country.","src":"우리말샘"},{"ko":"나라를 지키다.","en":"To defend one's country.","src":"우리말샘"}],"explain_en":"Koreans often call their country 우리나라 ('our country') rather than 한국. Even in front of elders it's 우리나라, not the humble 저희 나라 — you don't lower your country."},{"id":"n00395","kind":"word","ko":"서울","yo":"","en":"Seoul","pos":"명사","usage":"","contract":"","examples":[{"id":"e00047","ko":"우리 집은 서울에 있어요.","en":"Our home is in Seoul.","speech_level":"해요","cloze":"서울","extra_word":"","extra_grammar":""},{"id":"e00048","ko":"서울은 지하철이 정말 좋아요.","en":"Seoul's subway is really good.","speech_level":"해요","cloze":"서울","extra_word":"지하철 = subway","extra_grammar":""}],"pron":"서울","roman":"seoul","explain":"'서울'은 한자가 없는 순우리말이고, 원래 뜻은 '나라의 수도(capital)'예요. 그래서 '프랑스의 서울은 파리'처럼 말할 수도 있어요.","video_url":"","video_title":"","phrases":[{"ko":"서울 가서 김 서방 찾기","example":"주소도 없이 찾아요? 서울 가서 김 서방 찾기예요.","literal":"\"going to Seoul to find Mr. Kim\"","en_equiv":"close: looking for a needle in a haystack","meaning_en":"Searching for someone with almost no information.","nuance_ko":"막막하게 찾을 때","source":"우리말샘"},{"ko":"말은 제주도로, 사람은 서울로","example":"말은 제주도로, 사람은 서울로 보내라는 말이 있잖아요.","literal":"\"horses to Jeju, people to Seoul\"","en_equiv":"—","meaning_en":"Send children to Seoul (the big city) to succeed.","nuance_ko":"자녀 교육·진학 이야기","source":"common usage"},{"ko":"인서울","example":"동생 목표는 인서울이에요.","literal":"\"in Seoul\"","en_equiv":"—","meaning_en":"Getting into a university located in Seoul.","nuance_ko":"입시 이야기할 때","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[],"explain_en":"'서울' is a native Korean word with no Chinese characters, and it originally meant 'a nation's capital'. That's why you can even say '프랑스의 서울은 파리' (the capital of France is Paris)."},{"id":"n00420","kind":"word","ko":"고향","yo":"","en":"Hometown","pos":"명사","usage":"","contract":"","examples":[{"id":"e00049","ko":"제 고향은 부산이에요.","en":"My hometown is Busan.","speech_level":"해요","cloze":"고향","extra_word":"","extra_grammar":""},{"id":"e00050","ko":"친구 고향이 어디예요?","en":"Where is your friend's hometown?","speech_level":"해요","cloze":"고향","extra_word":"","extra_grammar":""}],"pron":"고향","roman":"gohyang","explain":"서울에서 지방으로 갈 때는 '내려가다', 지방에서 서울로 갈 때는 '올라가다'라고 해요. 그래서 설날과 추석에는 '고향에 내려가요'라는 말을 많이 들어요.","video_url":"","video_title":"","phrases":[{"ko":"제2의 고향","example":"서울은 제 제2의 고향이에요.","literal":"\"second hometown\"","en_equiv":"a second home","meaning_en":"A place that feels like home, though you weren't born there.","nuance_ko":"오래 살아 정든 곳","source":"common usage"},{"ko":"고향의 맛","example":"이 된장찌개, 고향의 맛이네요.","literal":"\"the taste of the hometown\"","en_equiv":"a taste of home","meaning_en":"Food that reminds you of home and childhood.","nuance_ko":"그리운 집밥 먹을 때","source":"common usage"}],"pron_source":"우리말샘","dict_examples":[{"ko":"고
