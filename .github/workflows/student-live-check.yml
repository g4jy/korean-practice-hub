name: Publish and verify student app links
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Build missing student practice apps']
    types: [completed]
permissions:
  contents: read
  pages: write
concurrency:
  group: student-app-live-check
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Request configured Pages publication
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p live-qa
          gh api --method POST repos/${{ github.repository }}/pages/builds > live-qa/pages-request.json
      - name: Install browser verification
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Verify actual HTTPS pages, MP3 recordings, PDFs and mobile browser
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,pathlib,time,hashlib,datetime,concurrent.futures
          from playwright.sync_api import sync_playwright
          Q=pathlib.Path('live-qa');Q.mkdir(exist_ok=True)
          base='https://g4jy.github.io/korean-practice-hub/students/'
          apps=sorted(p for p in pathlib.Path('students').iterdir() if (p/'data.json').exists());assert len(apps)==15
          nonce=str(int(time.time()))
          def get(url):
            request_url=url+('&' if '?' in url else '?')+'verify='+nonce
            with urllib.request.urlopen(urllib.request.Request(request_url,headers={'User-Agent':'Student-App-Validation','Cache-Control':'no-cache'}),timeout=40) as r:return r.status,r.headers.get('Content-Type',''),r.read(),url
          for attempt in range(30):
            try:
              nonce=str(int(time.time()))
              ready=True
              for f in ['data.json','audio-manifest.json']:
                result=get(base+'katharine/'+f)
                if hashlib.sha256(result[2]).digest()!=hashlib.sha256(pathlib.Path('students/katharine',f).read_bytes()).digest():ready=False
              if ready:break
            except Exception:pass
            if attempt==29:raise RuntimeError('Published student data and audio manifest did not become available')
            time.sleep(15)
          def verify(app):
            d=json.loads((app/'data.json').read_text());url=base+app.name+'/'
            status,ct,html,final=get(url);_,_,data,_=get(url+'data.json');_,_,audio,_=get(url+'audio-manifest.json');m=json.loads(audio)
            assert status==200 and d['student'] in html.decode(),app.name+' HTML'
            assert json.loads(data)['appId']==d['appId'] and hashlib.sha256(data).digest()==hashlib.sha256((app/'data.json').read_bytes()).digest(),app.name+' data'
            assert m['complete'] and len(m['generated'])==d['audioExpected'],app.name+' manifest'
            for suffix in ['-word','-polite','-example']:
              e=next(v for k,v in m['generated'].items() if k.endswith(suffix));code,typ,b,_=get(urllib.parse.urljoin(url,e['url']))
              assert code==200 and len(b)>1000 and hashlib.sha256(b).hexdigest()==e['sha256'],app.name+' '+suffix+' bytes SHA mismatch'
            code,typ,b,_=get(urllib.parse.urljoin(url,d['sheets'][0]['url']));assert code==200 and b.startswith(b'%PDF'),app.name+' PDF'
            return dict(name=d['student'],slug=app.name,url=final,http_status=status,app_id_matches=True,data_hash_matches=True,audio_manifest_complete=True,audio_entries=len(m['generated']),live_audio_samples=3,live_pdf=True,focus_words=sum(w['focus'] for w in d['words']),daily_pdfs=len(d['sheets']))
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:report=list(ex.map(verify,apps))
          old=[('Aisha','korean-vocab-review-r7m4q2/'),('Jack','korean-practice-hub/jack-review/'),('Loriana','korean-numbers-loriana/'),('Jaida Marie','korean-practice-jaida/'),('Kitty','korean-flashcard-kitty-001/'),('Samantha','korean-practice-samantha/'),('Sokvan','korean-vocab-review-1d44e9/'),('Chasity','korean-practice-chasity/')]
          existing=[]
          for name,path in old:
            status,ct,b,url=get('https://g4jy.github.io/'+path);assert status==200,name+' existing URL'
            existing.append(dict(name=name,url=url,http_status=status,action='Existing app retained; no content changes'))
          out=dict(checked_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),new_apps=report,existing_apps=existing,all_passed=True);(Q/'live-links.json').write_text(json.dumps(out,ensure_ascii=False,indent=2));print(json.dumps(out,ensure_ascii=False,indent=2))
          results=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            for row in report:
              context=browser.new_context(viewport={'width':390,'height':844});page=context.new_page();errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto(row['url']);page.wait_for_selector('[data-action=start]')
              assert page.evaluate('KATHARINE_DATA.appId')=='fly-korean-'+row['slug']+'-v1'
              assert page.evaluate('document.documentElement.scrollWidth<=innerWidth')
              page.locator('[data-action=start]').first.click();page.locator('[data-action=reveal]').click();page.locator('[data-audio]').first.click();page.wait_for_timeout(600)
              assert not errors
              page.screenshot(path=str(Q/(row['slug']+'-live.png')),full_page=True)
              results.append(dict(name=row['name'],url=row['url'],browser_loaded=True,mobile_width_ok=True,javascript_errors=errors));context.close()
            browser.close()
          (Q/'live-browser.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-student-app-live-links
          path: live-qa/
          retention-days: 14
